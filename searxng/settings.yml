# Nova's bundled metasearch service. Inherits SearXNG defaults; overrides only
# the two things a HEADLESS caller (core's web_search tool, a plain httpx GET —
# no browser, no cookies, no CSRF token) needs for /search?format=json to
# actually return results instead of a 403:
#
#   * search.formats must list `json`. Upstream defaults to html only, and a
#     format not on this list is refused outright — the JSON API simply does
#     not exist until json is added here.
#   * server.limiter must be false. The limiter bundles SearXNG's botdetection,
#     which blocks requests that don't look like a browser (missing Accept /
#     Accept-Language, no prior GET, JSON format from a bare client) — exactly
#     what an internal httpx call looks like — so with the limiter on, the JSON
#     call comes back 429/403. It is safe to disable because this instance is
#     never exposed beyond the compose network + loopback (docker-compose.yml
#     binds 127.0.0.1 only); the limiter defends PUBLIC instances from abuse,
#     which this is not.
#
# secret_key is substituted from $SEARXNG_SECRET by the image entrypoint;
# image_proxy is off (nothing renders remote images from here).
use_default_settings: true

server:
  secret_key: "${SEARXNG_SECRET}"
  limiter: false
  image_proxy: false

search:
  formats:
    - html
    - json
