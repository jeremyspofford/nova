name: nova

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - v4_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ../services/core
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://core:${POSTGRES_PASSWORD}@postgres:5432/nova_core
      SERVICE_TOKEN: ${CORE_TOKEN}
      GATEWAY_URL: http://gateway:8001
      CORE_GATEWAY_TOKEN: ${CORE_GATEWAY_TOKEN}
      MEMORY_URL: http://memory:8002
      CORE_MEMORY_TOKEN: ${CORE_MEMORY_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway:
    build:
      context: ../services/gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@postgres:5432/nova_gateway
      SERVICE_TOKEN: ${CORE_GATEWAY_TOKEN}
      OLLAMA_URL: http://ollama:11434
    volumes:
      # Ruling R2: install.sh writes <repo>/data/hardware.json on the host;
      # this compose file lives in deploy/, so the repo root is one level up.
      - ../data:/data:ro
      - v4_models:/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  memory:
    build:
      context: ../services/memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DATABASE_URL: postgresql://memory:${POSTGRES_PASSWORD}@postgres:5432/nova_memory
      SERVICE_TOKEN: ${CORE_MEMORY_TOKEN}
    volumes:
      - v4_memdata:/data/memory
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    # Start ordering only, deliberately not `condition: service_healthy`: if
    # core is sick the UI must still come up to say so, rather than leaving
    # the operator with nothing at all to look at.
    depends_on:
      - core
    healthcheck:
      # Self-only — this asks nginx for the app shell and touches no other
      # service, so a red `web` means nginx, never core.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    # PINNED, not `latest`. An untagged image is only pulled when it is absent,
    # so a host that already had `ollama/ollama:latest` from months ago keeps
    # running it — and the registry answers a current model's manifest with
    # `412: requires a newer version of Ollama`, which reads as "this model is
    # broken" rather than "this host is stale". That is exactly what happened
    # on the first DoD walk (2026-08-28): a cached 0.31.2 could not pull
    # qwen3.8:27b at all. Bump this deliberately.
    image: ollama/ollama:0.33.1
    restart: unless-stopped
    # The profile is kept so the container can be left out deliberately, but
    # install.sh turns it on: the wizard's first and default engine is
    # "Bundled Ollama", and core refuses to save an engine it cannot reach —
    # so without this container running, the bundled path is filtered out of
    # the wizard as dead and there is no local inference to choose at all.
    profiles: ["inference"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - v4_ollama:/root/.ollama
    healthcheck:
      # `ollama list` goes through the server's own API, so this is red until
      # the server is actually accepting requests — which is the moment the
      # gateway's liveness check would start passing too.
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

volumes:
  v4_pgdata:
  v4_models:
  v4_memdata:
  v4_ollama:
