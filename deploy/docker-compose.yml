name: nova

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - v4_pgdata:/var/lib/postgresql/data
      # Long syntax, not `./postgres-init:/docker-entrypoint-initdb.d:ro`,
      # because only the long form can carry the x-nova-backup rows below —
      # and a bind with no disposition refuses every backup (deploy/backup.sh).
      - type: bind
        source: ./postgres-init
        target: /docker-entrypoint-initdb.d
        read_only: true
        # Implied by short syntax, NOT by long: stated so the resolved
        # config is byte-identical to the short form this replaced.
        bind:
          create_host_path: true
        x-nova-backup: exclude-code
        x-nova-backup-reason: >-
          01-databases.sql, in git. A fresh v4_pgdata re-runs it from the
          checkout at restore time with the carried POSTGRES_PASSWORD, so
          carrying a copy would only offer a second, staler one.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ../services/core
    restart: unless-stopped
    # How long a redeploy waits after SIGTERM before SIGKILL. Compose's
    # default is 10s; a 27B chat turn runs 13-55s, so every `up -d core`
    # mid-turn killed the process before it could close the turn's trace
    # (measured 2026-09-01: one turn left status NULL, and the chat read it
    # as "still responding" for a day). 300s is the gateway read timeout —
    # the longest one gateway call can hold a turn open, and the uvicorn
    # --timeout-graceful-shutdown in services/core/Dockerfile — plus 30s
    # for the lifespan drain (close_turn, memory ingest) that uvicorn runs
    # only after that wait. Startup still sweeps whatever a SIGKILL leaves
    # (traces.sweep_orphaned_turns); this is what makes the sweep rare.
    stop_grace_period: 330s
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://core:${POSTGRES_PASSWORD}@postgres:5432/nova_core
      SERVICE_TOKEN: ${CORE_TOKEN}
      GATEWAY_URL: http://gateway:8001
      CORE_GATEWAY_TOKEN: ${CORE_GATEWAY_TOKEN}
      MEMORY_URL: http://memory:8002
      CORE_MEMORY_TOKEN: ${CORE_MEMORY_TOKEN}
      # The bundled metasearch service, reached in-network by the web_search
      # tool. Keyless (a stock battery, not a bearer peer) and loopback-only,
      # so this is a plain URL, not a token pair. Search is best-effort: core
      # does NOT depend_on it, so a slow or missing searxng never blocks core
      # from starting — web_search states "unavailable" instead of faking a
      # result (app/tools/web_search.py).
      SEARXNG_URL: http://searxng:8080
      # Where the workspace tools may write, and the only place they may.
      # Stated here rather than left to the code's default so the boundary
      # is visible next to the mount that backs it.
      WORKSPACE_ROOT: /data/workspace
      # S42b P15: the stack's own addresses, so core can tell which door an
      # agent's socket came through (app/network.py door_of). The same .env
      # keys and defaults web and the tailnet sidecar use below.
      NOVA_WEB_ADDR: ${NOVA_WEB_ADDR:-172.18.128.10}
      NOVA_TAILSCALE_ADDR: ${NOVA_TAILSCALE_ADDR:-172.18.128.20}
      NOVA_SUBNET_GATEWAY: ${NOVA_SUBNET_GATEWAY:-172.18.0.1}
      # Which GitHub repository is her own source code, and its default
      # branch — written by install.sh from the checkout's own origin
      # (record_repository). Empty when the remote is not GitHub; core then
      # says nothing about a repository rather than a placeholder.
      NOVA_REPO: ${NOVA_REPO:-}
      NOVA_REPO_BRANCH: ${NOVA_REPO_BRANCH:-}
      # Her browser (S38): where the engine listens, and where core sees the
      # files it writes (the same volume as its /output).
      BROWSER_MCP_URL: http://browser:8931/mcp
      BROWSER_OUTPUT_DIR: /data/browser-output
    volumes:
      # Nova's own scratch space, on a volume of its own: not the memory
      # store, not the repo, not the host. A file she writes lives here and
      # survives a rebuild, and nothing outside this volume is reachable
      # from a workspace tool.
      - v4_workspace:/data/workspace
      # The browser engine's output (S38). Core copies a reported download or
      # screenshot from here into the workspace and removes the engine's copy.
      - v4_browser_output:/data/browser-output
      # The tailnet's state as the sidecar last wrote it — how core learns the
      # address a QR code encodes (app/network.py, S47). Read-only: core never
      # writes it, and nothing in core may pretend to be the sidecar.
      - type: volume
        source: v4_status
        target: /run/nova-status
        read_only: true
      # The hub's build of Nova's agent (S42b), as agent-dist wrote it:
      # read-only — core serves it and signs its manifest, never writes it.
      - type: volume
        source: v4_agent_dist
        target: /dist
        read_only: true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S42b (D13): builds Nova's agent for the six targets from the committed
  # apps/novad tree. A one-shot under the `build` profile, so `up` never
  # starts it: ./install runs it (install_hub_agent) as
  #   git archive HEAD apps/novad | docker compose ... --profile build run --rm -T agent-dist <version>
  agent-dist:
    image: golang:1.27.1@sha256:3680233e3204827fbdc66088528ae6d4b3d034f51d03a99d454f6de034888244
    profiles: ["build"]
    entrypoint: ["sh", "/build/build.sh"]
    environment:
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
      GOCACHE: /cache/build
      GOMODCACHE: /cache/mod
      DIST_DIR: /dist
    volumes:
      - type: bind
        source: ./agent-dist
        target: /build
        read_only: true
        x-nova-backup: exclude-code
        x-nova-backup-reason: >-
          deploy/agent-dist/build.sh — the repository's own script, carried by git.
      - v4_agent_dist:/dist
      - v4_agent_build_cache:/cache

  gateway:
    build:
      context: ../services/gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      DATABASE_URL: postgresql://gateway:${POSTGRES_PASSWORD}@postgres:5432/nova_gateway
      SERVICE_TOKEN: ${CORE_GATEWAY_TOKEN}
      OLLAMA_URL: http://ollama:11434
    volumes:
      # Ruling R2: install.sh writes <repo>/data/hardware.json on the host;
      # this compose file lives in deploy/, so the repo root is one level up.
      - type: bind
        source: ../data
        target: /data
        read_only: true
        # Implied by short syntax, NOT by long: stated so the resolved
        # config is byte-identical to the short form this replaced.
        bind:
          create_host_path: true
        x-nova-backup: exclude-derived
        x-nova-backup-reason: >-
          hardware.json, rewritten by detect_hardware on every install
          (deploy/install.sh:808-863). The restored host's GPUs are not the
          source host's, so carrying this would describe the wrong machine.
      - v4_models:/models
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  memory:
    build:
      context: ../services/memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      DATABASE_URL: postgresql://memory:${POSTGRES_PASSWORD}@postgres:5432/nova_memory
      SERVICE_TOKEN: ${CORE_MEMORY_TOKEN}
    volumes:
      - v4_memdata:/data/memory
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../apps/web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    networks:
      default:
        # Fixed, in the upper half of the subnet (see `networks:` at the
        # bottom): the address the tailnet sidecar's `tailscale serve`
        # targets (S5b T1), so a recreated web keeps the address the sidecar
        # already knows — nothing to re-resolve, nothing to go stale.
        ipv4_address: ${NOVA_WEB_ADDR:-172.18.128.10}
    environment:
      # Blank = the pre-auth gate is OFF and nginx behaves exactly as before
      # this existed. Set to a `openssl rand -hex 32` value only when
      # temporarily exposing this origin on a public URL (e.g. a cloudflared
      # quick tunnel) — every path then needs a matching `nova_gate` cookie,
      # minted by visiting /gate?token=<the value>. install.sh deliberately
      # does not generate this: it's opt-in, never a default secret. See
      # apps/web/nginx.conf.template for the mechanism.
      NOVA_PUBLIC_GATE_TOKEN: ${NOVA_PUBLIC_GATE_TOKEN:-}
      # The ONE source address nginx believes a Tailscale-User-* identity
      # header from — the tailnet sidecar's fixed address (S5b T1 pins the
      # sidecar to it; a tailnet peer is exempt from the gate on that basis).
      # Rendered into the conf by envsubst at container start (the image's
      # ^NOVA_ filter), which is why it is passed here and not only read by
      # the sidecar; blank means nobody is trusted.
      NOVA_TAILSCALE_ADDR: ${NOVA_TAILSCALE_ADDR:-172.18.128.20}
    # Start ordering only, deliberately not `condition: service_healthy`: if
    # core is sick the UI must still come up to say so, rather than leaving
    # the operator with nothing at all to look at.
    depends_on:
      - core
    healthcheck:
      # Self-only, deliberately not `/` — `/` sits behind the pre-auth gate
      # (nginx.conf.template), so with the gate on a plain `GET /` would 401
      # and mark this container UNHEALTHY even though nginx is serving
      # correctly, breaking install.sh's wait_for_health and the e2e
      # waitForHealthy. `/healthz` is nginx's ONE ungated location — a
      # static "ok" with no proxy_pass, so this still touches no other
      # service and a red `web` still means nginx, never core, gate on or
      # off.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    # The volumes searxng's IMAGE declares (`VOLUME /etc/searxng`,
    # `VOLUME /var/cache/searxng`). Compose never NAMES an image-declared
    # volume, so there is no entry under `volumes:` below to hang a
    # disposition on — this block is the only place one can live, keyed by
    # mount target. /var/cache/searxng is live on this machine right now as an
    # anonymous 64-hex volume; without this row every backup refuses
    # (design-verdict.md §6.5). The image is deliberately unpinned, so the next
    # upstream image that adds a VOLUME line reproduces that refusal — which is
    # the behaviour we want. deploy/README.md carries the refresh procedure.
    x-nova-backup-anon:
      /etc/searxng:
        disposition: exclude-code
        reason: >-
          the generated runtime config. The settings come from ../searxng in
          git, which the bind below mounts over this target.
      /var/cache/searxng:
        disposition: exclude-ephemeral
        reason: a search result cache; it regenerates on use.
    # Nova's bundled web search. A stock metasearch engine — no key, no build,
    # just the upstream image plus our settings.yml. It comes up with the base
    # stack (no profile) so "what's the latest on X" always has a real search
    # behind it instead of the model guessing a URL. The image is `latest`
    # deliberately: it is not one of our built services, carries no state we
    # own, and a metasearch engine that lags upstream quietly stops matching
    # the sites it scrapes — pinning it would be a maintenance burden with no
    # reproducibility payoff here.
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      # The image's entrypoint substitutes this into settings.yml's
      # server.secret_key. A default keeps a bare `docker compose up` (no
      # install.sh) working; install.sh generates a real one into .env.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-nova-searxng-dev-secret}
    volumes:
      # The DIRECTORY, not the single settings.yml file. A single-file bind
      # resolves to a host inode at container-create time, so when Docker
      # Desktop recycled its WSL mount the v3 container died with exit 127 and
      # `restart: unless-stopped` retried it forever without ever repairing it
      # (v3 lost web search for 43h that way). Read-only: the service never
      # writes its own config.
      - type: bind
        source: ../searxng
        target: /etc/searxng
        read_only: true
        # Implied by short syntax, NOT by long: stated so the resolved
        # config is byte-identical to the short form this replaced.
        bind:
          create_host_path: true
        x-nova-backup: exclude-code
        x-nova-backup-reason: >-
          settings.yml, in git. This bind is also what covers the image's own
          /etc/searxng volume declaration at run time.
    ports:
      # Loopback only, like every other host bind here. Publishing is not
      # required — core reaches it in-network at http://searxng:8080 — but it
      # lets the operator eyeball the JSON API directly while verifying.
      - "127.0.0.1:8380:8080"
    healthcheck:
      # searxng/searxng ships wget and exposes /healthz; this touches only the
      # search service itself, so a red `searxng` means searxng, never core.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  browser:
    # Her browser (S38): Microsoft's Playwright MCP server, pinned by digest
    # in ./browser/Dockerfile. Core alone calls it, at http://browser:8931/mcp,
    # through its own MCP client (app/browser/engine.py) — never through her
    # mcp_call, and never as a row in mcp_servers. Her five tools are core's
    # (app/tools/browser.py) and never call the engine's run-any-code tools.
    #
    # No host port. The engine has no authentication of its own; anything on
    # this network could drive it, and only core does. One browser that
    # reaches everything — the internet, the LAN, the tailnet and Nova's own
    # UI — by the owner's choice (2026-09-30); the other services still need
    # their service token, so reaching them gains a page nothing.
    #
    # No depends_on in either direction: a browser that is down is a stated
    # failure in her tools, never a core that will not start.
    build:
      context: ./browser
    restart: unless-stopped
    # Chromium forks helpers; the image runs node as PID 1 with no reaper.
    init: true
    command:
      - "--port"
      - "8931"
      - "--host"
      - "0.0.0.0"
      # The engine refuses any other Host header (measured: 403 "Access is
      # only allowed at browser:8931"). 127.0.0.1 is the healthcheck's.
      - "--allowed-hosts"
      - "browser:8931,127.0.0.1:8931"
      # A page may not hand her tools of its own.
      - "--no-webmcp"
      # A persistent profile serves one browser instance, so every session —
      # a core restart starts a new one — shares this one context and page.
      - "--shared-browser-context"
      - "--user-data-dir"
      - "/profile"
      # Downloads, screenshots and the engine's console logs. Core copies
      # what the engine REPORTS into her workspace (app/browser/files.py);
      # the rest is evicted past this size, oldest first.
      - "--output-dir"
      - "/output"
      - "--output-max-size"
      - "2147483648"
      # A screenshot never travels as image data; actions carry no snapshot
      # (browser_read reads the page); paths come back absolute, so core can
      # map /output/… to its own mount.
      - "--image-responses"
      - "omit"
      - "--snapshot-mode"
      - "none"
      - "--file-paths"
      - "absolute"
      # Under core's 60 s call timeout, so a slow page is the engine's own
      # stated timeout rather than a client that gave up.
      - "--timeout-navigation"
      - "45000"
      - "--console-level"
      - "error"
      # Chromium closes after an idle hour and relaunches on the next call.
      - "--idle-timeout"
      - "3600000"
    volumes:
      - v4_browser_profile:/profile
      - v4_browser_output:/output
    healthcheck:
      # A bare GET of the MCP endpoint answers exactly 400 "Invalid request"
      # (measured 2026-10-01): the server is up and past its Host check. A 403
      # means the Host check moved; anything else, it is not serving.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8931/mcp').then(r=>process.exit(r.status===400?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ollama:
    # PINNED, not `latest`. An untagged image is only pulled when it is absent,
    # so a host that already had `ollama/ollama:latest` from months ago keeps
    # running it — and the registry answers a current model's manifest with
    # `412: requires a newer version of Ollama`, which reads as "this model is
    # broken" rather than "this host is stale". That is exactly what happened
    # on the first DoD walk (2026-08-28): a cached 0.31.2 could not pull
    # qwen3.8:27b at all. Bump this deliberately.
    image: ollama/ollama:0.33.1
    restart: unless-stopped
    # The profile is kept so the container can be left out deliberately, but
    # install.sh turns it on: the wizard's first and default engine is
    # "Bundled Ollama", and core refuses to save an engine it cannot reach —
    # so without this container running, the bundled path is filtered out of
    # the wizard as dead and there is no local inference to choose at all.
    profiles: ["inference"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - v4_ollama:/root/.ollama
    healthcheck:
      # `ollama list` goes through the server's own API, so this is red until
      # the server is actually accepting requests — which is the moment the
      # gateway's liveness check would start passing too.
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 20s

  tailscale:
    # Nova's own node on the owner's tailnet (S5b): ONE durable HTTPS origin,
    # https://<TAILNET_HOSTNAME>.<tailnet>.ts.net, that serves the UI, the API
    # and the device WebSocket to phones, laptops and remote novad daemons.
    # Opt-in: `NOVA_TAILNET=1 ./install` turns the profile on, asks for the
    # one thing only the owner holds (a TS_AUTHKEY, unless the state volume
    # already carries a logged-in node), and writes COMPOSE_PROFILES so a
    # bare `docker compose up -d` keeps converging it. install.sh REFUSES the
    # profile up front when it cannot log the node in — an engine you cannot
    # start is not an engine. See deploy/README.md, "Tailnet access".
    #
    # PINNED (2026-08-19 release). `latest` is what the old sidecar ran and
    # what changed under it; bump deliberately.
    image: tailscale/tailscale:v1.102.3
    profiles: ["tailnet"]
    restart: unless-stopped
    # An ordinary container at a FIXED address — no tun device, no
    # capabilities, no network namespace shared with anything (the pod shape
    # was measured to strand web on `docker restart`; see the plan). The
    # address is the one nginx trusts a Tailscale-User-* identity header
    # from (web's NOVA_TAILSCALE_ADDR above must be the same value — one
    # .env key feeds both). Userspace networking is what the old node ran
    # for months.
    networks:
      default:
        ipv4_address: ${NOVA_TAILSCALE_ADDR:-172.18.128.20}
    hostname: ${TAILNET_HOSTNAME:-nova}
    # tini as PID 1 so the wrapper is an ordinary child: signals reach its
    # trap and containerboot's orphans get reaped.
    init: true
    environment:
      # The node's name on the tailnet, i.e. the left-most label of the URL.
      TS_HOSTNAME: ${TAILNET_HOSTNAME:-nova}
      # Identity lives on the named volume below, so a restart, a recreate
      # or an image bump keeps the same node (same MagicDNS name, same cert)
      # without a new key: TS_AUTH_ONCE only logs in when that state is not
      # already logged in.
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      # Userspace (netstack) networking is also what lets `tailscale serve`
      # proxy to a REMOTE target (web's address): in kernel mode without
      # net_admin the CLI refuses a non-loopback target outright. Flipping
      # this to false means adding /dev/net/tun + cap_add net_admin, or the
      # mapping is never applied.
      TS_USERSPACE: "true"
      # Blank by default; install.sh asks for it (never generates one — only
      # the owner can mint it, at https://login.tailscale.com/admin/settings/
      # keys). It is used ONCE, on the first login, and then lingers in .env,
      # which is why a non-reusable key is the recommendation.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # Deliberately NO TS_SERVE_CONFIG: containerboot's serve path clears the
      # config on every start and re-applies it through a racy watcher (open
      # upstream bug). The serve mapping has ONE writer — tailscale/start.sh,
      # on every start, verified — and it targets web's fixed address.
      NOVA_WEB_ADDR: ${NOVA_WEB_ADDR:-172.18.128.10}
    volumes:
      - v4_tailscale:/var/lib/tailscale
      # What tailscaled says, rewritten every 15 s by start.sh (section 4b) for
      # core's one reader, app/network.py (S47).
      - v4_status:/run/nova-status
      # The DIRECTORY, read-only — never a single-file bind (a single-file
      # mount resolves to a host inode at create time and dies with exit 127
      # when Docker Desktop recycles its WSL mount; searxng above says why).
      - type: bind
        source: ./tailscale
        target: /config
        read_only: true
        # Implied by short syntax, NOT by long: stated so the resolved
        # config is byte-identical to the short form this replaced.
        bind:
          create_host_path: true
        x-nova-backup: exclude-code
        x-nova-backup-reason: >-
          start.sh and serve_check.sh, in git. The node's identity is on
          v4_tailscale, not here.
    # `sh` explicitly, so the wrapper does not depend on an executable bit
    # surviving the bind mount.
    command: ["sh", "/config/start.sh"]
    # The hash of ./tailscale/*.sh, written to .env by install.sh
    # (record_tailscale_scripts). start.sh runs once, at container start, and
    # a script edit is not a config change, so without this `up` leaves the
    # sidecar on the old script. A changed hash IS a config change: compose
    # recreates this container then, and only then. install.sh reads the label
    # back off the running container and refuses "Nova is up" if it is not
    # this checkout's (verify_tailscale_scripts).
    labels:
      nova.tailscale-scripts: ${NOVA_TAILSCALE_SCRIPTS:-}
    healthcheck:
      # The SAME two facts the wrapper verifies, read from tailscaled each
      # time (tailscale/serve_check.sh): BackendState Running, and the serve
      # config mapping HTTPS 443 to http://$NOVA_WEB_ADDR:80. So `compose ps`
      # and install.sh's health table say "healthy" only when a tailnet peer
      # would actually get web — a green tailscale never means less than
      # that. start_period covers the first login.
      test: ["CMD", "sh", "/config/serve_check.sh"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 90s

networks:
  # Declared so the project network's addressing is a fact of this file
  # rather than whatever docker handed out. The tailnet sidecar (S5b T1)
  # targets web at a FIXED address, and web's nginx trusts an identity
  # header from the sidecar's FIXED address alone (apps/web/
  # nginx.conf.template, $from_sidecar): on a bridge a TCP connection cannot
  # be completed with a spoofed source address, so the address IS the trust
  # boundary — and it has to be one nothing else can ever be handed.
  #
  # The subnet matches the network the live instance already has
  # (172.18.0.0/16, gateway .1; every container so far at .2–.9), so
  # declaring it moves nothing. Dynamic allocation is confined to the lower
  # half (ip_range /17); the fixed addresses live in the upper half
  # (172.18.128.x), where the allocator never reaches.
  #
  # Changing IPAM on a network that already exists is NOT applied in place —
  # compose will say so. It is a one-time `docker compose down && docker
  # compose up -d` at deploy: the network is recreated, volumes are
  # untouched. A RUNNING container that is not this project's but is
  # attached to the network (the old nova4-tailscale-1 was `docker network
  # connect`ed) blocks the recreate with "network has active endpoints" and
  # leaves web down — stop or disconnect it FIRST.
  default:
    ipam:
      config:
        # decide_subnet (deploy/subnet.sh) writes these into .env when 172.18
        # is already taken on the host — measured on the mini PC, where four
        # other bridges held 172.17 through 172.21. Hardcoding the subnet here
        # while decide_subnet wrote an address into .env would put the web
        # address on a network compose still pinned elsewhere, and `up` fails.
        # The defaults keep an existing install byte-identical.
        - subnet: ${NOVA_SUBNET:-172.18.0.0/16}
          ip_range: ${NOVA_SUBNET_RANGE:-172.18.0.0/17}
          gateway: ${NOVA_SUBNET_GATEWAY:-172.18.0.1}

# Every entry here carries its own x-nova-backup disposition and a reason.
# The disposition lives BESIDE the thing it describes, in the same document
# the declared set is read from, so it cannot go stale against that document —
# and a volume added without one does not get quietly skipped, it REFUSES the
# whole backup by name (deploy/backup/novabundle.py, R2_UNCLASSIFIED). The
# eight legal values are include, dump-pg, move-only, exclude-code,
# exclude-redownload, exclude-derived, exclude-ephemeral, exclude-declined;
# every exclude-* MUST carry a non-empty reason. See design-verdict.md §6.
volumes:
  v4_pgdata:
    x-nova-backup: dump-pg
    x-nova-backup-reason: >-
      a live PGDATA file copy is torn. Captured as pg_dump -Fc per database;
      a fresh volume initialises from deploy/postgres-init/01-databases.sql
      with the carried password.
  v4_models:
    x-nova-backup: exclude-redownload
    x-nova-backup-reason: >-
      gateway's /models. Its only reader in the whole service is os.statvfs
      for a free-space check (services/gateway/app/admin.py:59,332).
  v4_memdata:
    x-nova-backup: include
    x-nova-backup-reason: >-
      the notes (services/memory/app/store.py:1-18) — the state with no other
      copy anywhere. .embeddings/*.jsonl rides along; it is a cache and
      carrying it only saves a rebuild.
  v4_workspace:
    x-nova-backup: include
    x-nova-backup-reason: >-
      Nova's own scratch space; a file she wrote lives only here.
  v4_browser_profile:
    x-nova-backup: include
    x-nova-backup-reason: >-
      her browser profile (S38): the sites she is signed in to. The bundle is
      encrypted. Chromium's caches ride along; they cost size, nothing else.
  v4_browser_output:
    x-nova-backup: exclude-ephemeral
    x-nova-backup-reason: >-
      the browser engine's scratch: downloads and screenshots before core
      copies them into v4_workspace (which carries them), and its console logs.
  v4_ollama:
    x-nova-backup: exclude-redownload
    x-nova-backup-reason: >-
      local model weights, tens of GB, re-pulled. Stated cost: a restore on a
      disconnected machine has no local inference until the pulls finish.
  # The tailnet node's identity (tailscaled.state, certs, MagicDNS name).
  # Compose names it <project>_v4_tailscale. Deliberately NOT `tailscale_state`:
  # a volume of THAT name already exists under this project name
  # (`nova_tailscale_state`, created by the v3 stack) and the old "nova" node
  # — `nova4-tailscale-1`, still running — mounts it as its state dir
  # (measured 2026-09-03). A v4 key of the same name would attach a second
  # tailscaled to a live node key, and the two flap. The old node's state is
  # MIGRATED into this volume at T3 with the old container stopped
  # (deploy/README.md), never shared live.
  v4_tailscale:
    x-nova-backup: move-only
    x-nova-backup-reason: >-
      the tailnet node identity. Two live nodes sharing one identity flap, so
      it travels only on a move — which also leaves MOVED_TO behind.
  v4_status:
    x-nova-backup: exclude-derived
    x-nova-backup-reason: >-
      tailscale.json, rewritten by deploy/tailscale/start.sh every 15 s from
      tailscaled's own state; carried to another host it would describe the
      source's tailnet, not the target's.
  v4_agent_dist:
    x-nova-backup: exclude-derived
    x-nova-backup-reason: >-
      Nova's agent built for six systems from the committed apps/novad tree;
      ./install rebuilds it from the same tree, byte for byte.
  v4_agent_build_cache:
    x-nova-backup: exclude-ephemeral
    x-nova-backup-reason: >-
      Go's build and module caches for agent-dist — they only make a rebuild faster.
