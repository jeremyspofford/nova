[package]
name = "novad"
version = "0.7.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Nova device agent: supervisor for signed, sandboxed modules, the management channel and device file operations (docs/23)."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ed25519 (RFC 8032) and SHA-2 from audited crates instead of hand-written code (src/crypto.rs).
# No "fast" (precomputed tables: binary size) and no "std"; "zeroize" wipes the signing key on drop.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.10.9", default-features = false }
# TLS to the Hub (R-023, FR-126): rustls (Apache-2.0 OR ISC OR MIT) with the ring provider (ring
# 0.17, Apache-2.0 AND ISC; it builds with the C compiler of the Rust image, aws-lc would need
# cmake). TLS 1.3 and 1.2, no logging; certificate checks are rustls-webpki (ISC). src/tls.rs.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# The local runtime binds each user's socket in a child that switched to the user's ids and hands
# the descriptor back over SCM_RIGHTS (src/user_socket.rs): fork, setuid and sendmsg are not in
# std. MIT OR Apache-2.0; already in the build through ring.
libc = { version = "=0.2.191", default-features = false }
# The browser module answers the Hub's DevTools WebSocket itself (src/ws.rs, FR-209): the
# handshake's accept key is SHA-1 by RFC 6455, which sha2 does not have. ring is already in the
# build through rustls (same version, Apache-2.0 AND ISC); only its legacy digest is used.
ring = { version = "=0.17.14", default-features = false }

[dev-dependencies]
# Test certificates (a Hub CA, leaves, device certificates, revocation lists) are made when the
# tests run, so no key material is committed. MIT OR Apache-2.0.
rcgen = { version = "=0.14.10", default-features = false, features = ["crypto", "ring", "pem"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
