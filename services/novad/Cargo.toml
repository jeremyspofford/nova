[package]
name = "novad"
version = "0.6.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Nova device agent: supervisor for signed, sandboxed modules, the management channel and device file operations (docs/23)."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ed25519 (RFC 8032) and SHA-2 from audited crates instead of hand-written code (src/crypto.rs).
# No "fast" (precomputed tables: binary size) and no "std"; "zeroize" wipes the signing key on drop.
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
sha2 = { version = "=0.10.9", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "unwind"
strip = true
