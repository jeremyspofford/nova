[project]
name = "nova-core"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "asyncpg",
    "httpx",
    "argon2-cffi",
    "cryptography",
    # S28: multipart uploads. FastAPI refuses to even BUILD a route with a
    # File/Form parameter without it, at import time, so a missing wheel is
    # a service that will not start rather than a route that 500s.
    "python-multipart",
    # S28: reading the text out of a PDF he attached. Pure Python, no system
    # libraries — it has to build in the same slim image as everything else.
    # A scanned PDF has no text layer and yields nothing; that is a fact the
    # extraction STATES rather than an error, because "this PDF is pictures"
    # is the answer in that case.
    "pypdf",
    # S41: the backup's pack step parses the raw compose text with PyYAML
    # inside THIS image (s41/rulings.md, 2026-09-21). PyYAML was already in
    # the runtime closure — but only TRANSITIVELY, through `uvicorn[standard]`,
    # while the line that looked like a declaration sat in the dev group and
    # the image builds `uv sync --frozen --no-dev`. A load-bearing import that
    # rests on another package's optional extra is one dependency bump away
    # from disappearing, so it is stated here.
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    # The lint CI runs (`uv run ruff check .`). Declared here so the runner
    # has it — locally it resolved from the host PATH and CI had none.
    "ruff==0.15.21",
    "pytest",
    "pytest-asyncio",
    # pyyaml moved to [project].dependencies (S41) — it is what the pack step
    # imports at runtime, not only what the tests import. A runtime dependency
    # is installed for the dev sync too, so nothing here needs to repeat it.
    "pytest-timeout>=2.4.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
# No test may hang the suite. Before item 0 (2026-09-18) one spinning
# drain_background wedged the whole run at ~12% with no output naming the test,
# and a wedged suite is a tripwire that cannot fire. Two minutes is ~50x the
# slowest test; SIGALRM interrupts both a blocked await and a Python-level spin,
# fails THAT test by name, and lets the rest of the suite run.
timeout = 120
timeout_method = "signal"
