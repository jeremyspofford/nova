[project]
name = "nova-memory"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "asyncpg",
    "pyyaml",
    # S13-5: the embedder talks HTTP to ollama's /api/embed from inside an
    # async route, so it needs an async client. httpx was already here as a
    # test dependency; this moves it to a runtime one because the service now
    # makes calls of its own rather than only receiving them.
    "httpx",
]

[dependency-groups]
dev = [
    # The lint CI runs (`uv run ruff check .`). Declared here so the runner
    # has it — locally it resolved from the host PATH and CI had none.
    "ruff==0.15.21",
    "pytest",
    "pytest-asyncio",
    "httpx",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
