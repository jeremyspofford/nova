# Every change to Nova passes these before it can merge (OPERATING-RULES: a red suite blocks merges).
# What blocks what, by kind of pull request, and what happens on main: docs/PIPELINE.md.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A pull request's runs share one group, so a new push cancels the run for the push before it.
  # Main gets a group per commit and is never cancelled: every merge commit's run is its record.
  # (The old shared ci-refs/heads/main group did not cancel a running main run, but GitHub keeps
  # only one pending run per group, so a third merge cancelled the second one's queued run: 56 main
  # runs ended "cancelled" that way, e.g. run 42872635055 on 2026-11-10.)
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || format('ci-main-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What the change touches (scripts/ci-changes.sh): a docs-only change skips the heavy jobs, and a
  # pull request that touches no UI surface leaves the UI gate and shots to the push to main.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      heavy: ${{ steps.sort.outputs.heavy }}
      computer: ${{ steps.sort.outputs.computer }}
      ui: ${{ steps.sort.outputs.ui }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: sort
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          # A pull request is checked out as its merge commit, whose first parent is the base it
          # merges into, so that diff is exactly its change. A push compares with what main was
          # before it. A new ref, or a base that can't be found, gives no file list: that counts as code.
          if [ "$EVENT" = pull_request ]; then from="$(git rev-parse HEAD^1)"; else from="$BEFORE"; fi
          files=""
          if [ -n "$from" ] && ! echo "$from" | grep -q '^0*$' && git cat-file -e "$from^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$from" "$SHA")"
          fi
          printf '%s\n' "$files" | sed 's/^/  /'
          printf '%s\n' "$files" | sh scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  checks:
    name: lint · typecheck · themes · tests
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    # A hung test fails the job instead of holding a runner for hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # A pull request that changes what Nova ships (src/, ui/, skills/, templates/, system/) adds a
      # changelog fragment and a ledger entry (scripts/check-changelog.sh), unless it is labelled
      # no-changelog (after labelling, re-run this job). The checkout is one commit deep: the base
      # branch and enough history to find where the branch left it are fetched first.
      - name: changelog and ledger entries
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
          NO_CHANGELOG: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') && '1' || '' }}
        run: |
          git fetch --no-tags --depth=200 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE" "$GITHUB_SHA"
          sh scripts/check-changelog.sh "origin/$BASE"
      # Installs the toolchain pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - run: node --version
      - run: npm ci
      # No raw colours, sizes or font names in UI code.
      - run: npm run lint:tokens
      # The TypeScript core (src/core) is typechecked; the JavaScript modules that predate it
      # get a parse check until they move to TypeScript.
      - run: npm run typecheck
      - name: syntax (JavaScript)
        run: |
          set -e
          for f in $(git ls-files 'src/*.js' 'src/**/*.js' 'scripts/*.js' 'tests/*.js' 'ui/js/*.js'); do
            node --check "$f"
          done
      - run: npm run check:themes
      # Nova Computer's one image (M10a), pinned by digest in src/core/computer/policy.ts, pulled ahead
      # when Nova Computer's code or tests change. Otherwise its tests pull it themselves on first use
      # (tests/core/computer-support.ts), and skip, saying why, only where Docker isn't available.
      - name: Nova Computer image
        if: needs.changes.outputs.computer == 'true'
        run: docker pull "$(node --input-type=module -e "const m = await import('./src/core/computer/policy.ts'); console.log(m.IMAGE)")"
      - run: npm test
      - run: npm audit --audit-level=high

  ui-gate:
    # The M3 gate in a real browser: live design-system swap, the resize/posture sweep, and setup
    # completed from the PWA alone. In CI it never skips: no browser is a failure. The fold-posture
    # gate (tests/ui/fold-postures.test.ts, UX review F8/F9) runs here too, in Chromium and WebKit
    # (both in this image): the review's ten postures over every main view, the derived bands in
    # every design system, the committed screenshot baselines and the safe area. It gates, like the
    # rest of test:ui.
    name: UI gate (Chromium and WebKit) ${{ matrix.shard }}
    needs: changes
    # On a pull request only when it touches a UI surface; on the push to main for every heavy merge,
    # whatever it touched (docs/PIPELINE.md).
    if: needs.changes.outputs.heavy == 'true' && (github.event_name == 'push' || needs.changes.outputs.ui == 'true')
    runs-on: ubuntu-latest
    # The suite runs in eight shards side by side, every test file in exactly one of them: by November
    # 2026 the whole suite took over 45 minutes in one job and the backstop below cut it off mid-run.
    # scripts/ui-shard.js balances the shards by measured file times (Node's --test-shard dealt files
    # round-robin by name: one half took ~32 minutes, the other ~17). A failed or cancelled shard fails the gate.
    # Four shards took 15.6–20.8 minutes each (2026-11-11), the pipeline's long pole; eight halve that.
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8', '8/8']
    # Each shard's tests take about 9 minutes. PR #236's first run hung for 90: a failed test left a server
    # open, so its file never ended (test:ui now force-exits and times tests out). This is the backstop.
    timeout-minutes: 45
    # The Playwright image for the pinned playwright-core (package.json): its Chromium and system
    # libraries, the same image scripts/ui-test.sh uses locally. (Playwright 1.56 can't install
    # its browser on the runner's own Ubuntu 26.04.)
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm run test:ui:shard
        env:
          NOVA_UI_SHARD: ${{ matrix.shard }}
          NOVA_UI_SHOTS: ${{ runner.temp }}/ui-shots
      # The accessibility advisory (UX review 1, F5): axe-core's default rules (pinned in package.json)
      # over every view at ten postures, per rule and per view in the job summary, so regrowth shows
      # on the PR. Advisory only: the script always exits 0, and continue-on-error keeps even a crash
      # from failing this job or the gate.
      - name: accessibility (advisory, never fails)
        # Once, in the first shard's job (scripts/ui-shard.js gives that shard less test time to match).
        if: ${{ !cancelled() && matrix.shard == '1/8' }}
        continue-on-error: true
        timeout-minutes: 15
        run: npm run ui:axe
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-gate-screenshots-${{ strategy.job-index }}
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore

  # The Era-2 walkthrough (scripts/shots.js, Ponytail D4): the only browser run of the install-skill,
  # schedule, helper, zip-add, memory and Gmail flows, plus the golden screens in every theme. The
  # shots go to $RUNNER_TEMP and up as an artifact, never into git (decision N2; D5 deleted the
  # committed copies). It gates, like the UI gate, and runs when the UI gate does.
  shots:
    name: shots (Era-2 walkthrough)
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (github.event_name == 'push' || needs.changes.outputs.ui == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: sh scripts/tripwire.sh node scripts/shots.js "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  # The one required check. It always runs. scripts/ci-gate.sh decides (tests/ci-gate.test.js):
  # docs only, every heavy job skipped; a UI pull request, checks, UI gate and shots all passed; a
  # non-UI pull request, checks passed and the UI gate and shots skipped; the push to main, all
  # three passed. Anything else fails, so a failed, cancelled or unexpectedly skipped job always does.
  gate:
    name: gate
    if: always()
    needs: [changes, checks, ui-gate, shots]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci-gate.sh
          sparse-checkout-cone-mode: false
      - env:
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          UI_SURFACE: ${{ needs.changes.outputs.ui }}
          CHECKS: ${{ needs.checks.result }}
          UI: ${{ needs.ui-gate.result }}
          SHOTS: ${{ needs.shots.result }}
        run: sh scripts/ci-gate.sh

  # Main went red after a merge: an issue says so (labelled main-red), and scripts/merge-on-green.sh
  # merges nothing more until a pull request that fixes it forward ("Fixes #N") lands. Only this job
  # may write issues. One open main-red issue at a time: a later red run comments on it.
  main-red:
    name: main red → issue
    needs: [changes, checks, ui-gate, shots, gate]
    if: always() && github.event_name == 'push' && needs.gate.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_MSG: ${{ github.event.head_commit.message }}
          RESULTS: "changes ${{ needs.changes.result }} · checks ${{ needs.checks.result }} · UI gate ${{ needs.ui-gate.result }} · shots ${{ needs.shots.result }} · gate ${{ needs.gate.result }}"
        run: |
          set -eu
          short=$(printf '%s' "$SHA" | cut -c1-8)
          # The merged pull request, from the merge commit's first line ("Merge pull request #N from …").
          pr=$(printf '%s\n' "$HEAD_MSG" | head -1 | grep -oE '#[0-9]+' | head -1 || true)
          failing=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | "- \(.name): \(.conclusion)"' || true)
          [ -n "$failing" ] || failing="- (job list unavailable) $RESULTS"
          body=$(printf 'Main went red at %s after merging %s.\n\nRun: %s\n\nFailing jobs:\n%s\n\nResults: %s\n\nMerges pause until this is fixed forward: scripts/merge-on-green.sh refuses every pull request except one whose body says "Fixes #<this issue>" (docs/PIPELINE.md).\n' \
            "$SHA" "${pr:-a direct push}" "$RUN_URL" "$failing" "$RESULTS")
          gh label create main-red --color B60205 --description "Main is red after a merge: merges pause until fixed forward (docs/PIPELINE.md)" 2>/dev/null || true
          open=$(gh issue list --label main-red --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
            echo "Commented on main-red issue #$open"
          else
            gh issue create --title "Pipeline: main is red at $short" --label main-red --label pipeline --body "$body"
          fi
