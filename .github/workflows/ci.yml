# CI pipeline (docs/16 §9). Every job must pass before a change is accepted.
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · unit · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The cloud runner's and the Hub's sandbox tests run under bubblewrap (they skip without it,
      # and the runner's coverage floor then fails). Ubuntu's AppArmor blocks the unprivileged user
      # namespaces bubblewrap needs unless this is relaxed.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / true
      - run: node scripts/secret-scan.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/check-spec.mjs
      - run: node scripts/notices.mjs --check
      - run: npm audit --omit=dev --audit-level=high

  novad:
    name: novad (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: cargo test --manifest-path services/novad/Cargo.toml
      - run: cargo build --release --manifest-path services/novad/Cargo.toml
      # Contract test: the capability document matches contracts/schemas/device-capability.json.
      - run: npx vitest run --root packages/shared test/contracts.test.ts
      # The Hub's tests against the real binary (enrollment, signed install, Add Device, mutual
      # TLS). The checks job has no binary, so they skip there; here a missing one fails.
      - run: >-
          npx vitest run test/devices-novad.test.ts test/agent-dist-novad.test.ts
          test/m65-integration.test.ts test/m7-novad-tls.test.ts test/m75-novad-mtls.test.ts
        working-directory: apps/hub
        env:
          NOVA_NOVAD_BIN: ${{ github.workspace }}/services/novad/target/release/novad
          NOVA_REQUIRE_NOVAD: '1'

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # J8.5 runs the real novad and the Hub serves it to `novad install` (e2e/support/m65.ts).
      - run: cargo build --release --manifest-path services/novad/Cargo.toml
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  # The desktop shell's own journey (apps/desktop/e2e, docs/16 §3.3): Playwright's Electron support
  # against a real Hub over HTTPS. It runs in the Playwright image, which has Electron's system
  # libraries and xvfb-run (test:shell wraps itself in `xvfb-run -a` without a display); inside a
  # container the shell starts with --no-sandbox (apps/desktop/e2e/support.ts).
  e2e-shell:
    name: e2e (desktop shell, Electron)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      # Electron's binary comes from its own install script.
      - run: node node_modules/electron/install.js
      - run: npm run build -w apps/web
      - run: npm run test:shell -w apps/desktop
        env:
          CI: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: shell-report
          path: test-results/shell/
          retention-days: 7
