# The repo had no CI at all. Everything here was already runnable by hand and
# already passing — the gap was that nothing ran it on a push, so a
# regression only surfaced when someone happened to try the command.
#
# Deliberately no services: the backend suites are hermetic (temp-dir memory
# sandbox, stubbed LLM stream, stubbed tool registry — no database, no
# network, no model), which is what makes this fast enough to be worth
# waiting for.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ./backend
      - name: Lint
        run: |
          pip install ruff
          ruff check backend/
      - name: Tests
        run: python backend/tests/run_all.py
        env:
          PYTHONPATH: backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc is the frontend's whole safety net right now (strict, noUnusedLocals,
      # zero `any` in the tree) — there is no test runner yet.
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # catches a malformed compose file before it wedges a deploy
      - name: Validate docker-compose
        run: docker compose config --quiet
