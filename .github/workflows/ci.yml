# Every change to Nova passes these before it can merge (OPERATING-RULES: a red suite blocks merges).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · themes · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in mise.toml.
      - uses: jdx/mise-action@v5
      - run: node --version
      - run: npm ci
      # No raw colours, sizes or font names in UI code.
      - run: npm run lint:tokens
      # The TypeScript core (src/core) is typechecked; the JavaScript modules that predate it
      # get a parse check until they move to TypeScript.
      - run: npm run typecheck
      - name: syntax (JavaScript)
        run: |
          set -e
          for f in $(git ls-files 'src/*.js' 'src/**/*.js' 'scripts/*.js' 'tests/*.js' 'ui/js/*.js'); do
            node --check "$f"
          done
      - run: npm run check:themes
      - run: npm test
      - run: npm audit --audit-level=high

  ui-gate:
    # The M3 gate in a real browser: live design-system swap, the resize/posture sweep, and setup
    # completed from the PWA alone. In CI it never skips: no browser is a failure.
    name: UI gate (Chromium)
    runs-on: ubuntu-latest
    # The Playwright image for the pinned playwright-core (package.json): its Chromium and system
    # libraries, the same image scripts/ui-test.sh uses locally. (Playwright 1.56 can't install
    # its browser on the runner's own Ubuntu 26.04.)
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: npm ci
      - run: npm run test:ui
        env:
          NOVA_UI_SHOTS: ${{ runner.temp }}/ui-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-gate-screenshots
          path: ${{ runner.temp }}/ui-shots
          if-no-files-found: ignore
