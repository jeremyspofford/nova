name: rebuild-ci

on:
  push:
    branches: ["rebuild/**"]
  pull_request:
    branches: ["rebuild/**"]

jobs:
  services:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [core, gateway, memory]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    # Without a database the DB-backed suites skip themselves with a stated
    # reason — honest, but a green run that proved almost nothing. Each
    # matrix leg gets its own throwaway postgres so they actually run.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
