name: Handoffs pickup

# Wakes a headless Claude whenever a request lands in handoffs/inbox/.
# Mailbox replies are committed to main; code changes go to a branch + PR
# for Jeremy's review. See handoffs/README.md for the protocol.
#
# Implementation note: this drives the Claude Code CLI directly. The
# anthropics/claude-code-action wrapper rejects `push` events
# ("Unsupported event type: push" — it is built for issue/PR mentions),
# which was this workflow's first-run failure on 2026-10-21.

on:
  push:
    branches: [main]
    paths:
      - 'handoffs/inbox/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: handoffs-pickup
  cancel-in-progress: false

jobs:
  pickup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Preflight (reports via annotations Muse can read)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is empty in this run — the repository secret is missing or named differently."
            exit 1
          fi
          case "$ANTHROPIC_API_KEY" in
            sk-ant-*) echo "::notice::API key present: Anthropic format, length ${#ANTHROPIC_API_KEY}." ;;
            *) echo "::error::API key present (length ${#ANTHROPIC_API_KEY}) but NOT in Anthropic format (sk-ant-...) — wrong key or wrong provider." ;;
          esac

      - name: Process the handoffs inbox
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/pickup-prompt.txt <<'PROMPT'
          You are the Nova handoff pickup, running headless in GitHub
          Actions. Muse (Jeremy's personal agent) files requests in
          handoffs/inbox/ of this repo. Read handoffs/README.md first
          and follow it.

          For every file in handoffs/inbox/ (ignore .gitkeep):

          1. Read the request fully before acting.
          2. Mailbox requests (confirmations, questions, status asks —
             including 2026-10-21-2026-routine-ping.md, for which YOU
             are the designated pickup): write the reply to
             handoffs/outbox/ with the SAME filename, move the request
             file to handoffs/archive/, commit those handoff files
             directly to main with a clear message, and push.
          3. Build/fix requests (anything asking for code changes): do
             the work on a new branch named claude/handoff-<request-id>,
             run the project's tests, push the branch, and open a pull
             request into main with `gh pr create`, summarizing the
             change and the test results. Write the outbox reply (same
             filename) naming the PR, move the request to
             handoffs/archive/, and commit those handoff files to main
             as in step 2. NEVER merge a pull request yourself.
          4. If a request is ambiguous, or you cannot complete it
             safely: do not guess and do not archive it. Write the
             blocker or question as the outbox reply (same filename)
             and leave the request in the inbox.

          Standing rules: never tag, delete, reset, rebase, or
          force-push anything; never delete branches; changes outside
          handoffs/ happen only on a claude/handoff-* branch, never on
          main. If the inbox has no actionable requests, finish
          quietly without committing anything.
          PROMPT
          set +e
          claude -p "$(cat /tmp/pickup-prompt.txt)" --dangerously-skip-permissions --max-turns 80 2>&1 | tee /tmp/claude-out.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "::error::claude exited with code $code — last output lines follow."
            tail -n 12 /tmp/claude-out.txt | while IFS= read -r line; do
              esc=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g')
              echo "::error::$esc"
            done
            exit "$code"
          fi
