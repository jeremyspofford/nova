# Pinned so container labels/names are stable regardless of the checkout
# directory — the inference-control sidecar targets this project by name.
name: nova

services:
  postgres:
    image: postgres:16-alpine
    # The four services below ARE the product, and they were the only ones
    # without a restart policy — every sidecar had one. That is why a WSL
    # reboot left postgres/backend/frontend/web sitting in Exited(255)
    # while ollama, ntfy and the rest came back on their own, and Nova had
    # to be started by hand every time.
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nova-dev-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nova"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    # dev ergonomics live here, not in the image: the source is bind-mounted
    # below, so the reloader picks up edits without a rebuild
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql://nova:${POSTGRES_PASSWORD:-nova-dev-password}@postgres:5432/nova
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      NOVA_AUTH_TOKEN: ${NOVA_AUTH_TOKEN:-}
      NOVA_TRUST_LOCALHOST: ${NOVA_TRUST_LOCALHOST:-true}
      # Master key for the encrypted secrets store. Undeclared until
      # 2026-08-05, which made it unreachable — there is no env_file: here, so
      # `docker compose exec backend env | grep NOVA_SECRET` returned nothing
      # and the remedy secret_store printed, Settings -> Secrets showed and
      # the operator notes prescribed did precisely nothing. Unset is fine and
      # is the single-machine default: the backend generates a key into the
      # nova_state volume. It matters on the two events the docs anticipate —
      # a second instance against this Postgres, and restoring a bundle on a
      # new host, since backup bundles exclude the key by default.
      NOVA_SECRET_KEY: ${NOVA_SECRET_KEY:-}
      OKF_MEMORY_DIR: /app/data/memory
      NOVA_BACKUP_DIR: /app/data/backups
      NOVA_PROJECT_DIR: /app/project
      NOVA_PROJECT_DIR_HOST: ${PWD:-/home/jeremy/workspace/nova}

      # labelled wake-word clips (voice.wake_learning, off by default) — plain
      # files next to memory, so tools/wake-training reads them directly
      WAKE_TRAINING_DIR: /app/data/wake-training
      # absolute for the same reason OKF_MEMORY_DIR is: uvicorn runs from
      # /app/backend, so a relative default would resolve INSIDE the source
      # mount and quietly scatter the operator's files through the checkout
      WORKSPACE_DIR: /app/data/workspace
      # shown read-only in Settings → Storage — the mount itself is fixed at
      # container-create time and can't be changed from inside the container
      NOVA_MEMORY_DIR_HOST: ${NOVA_MEMORY_DIR:-./data/memory}
      # ditto: where the bundled model weights live (empty = default docker
      # volumes). Display-only for the backend; the actual mounts are on the
      # ollama/kokoro/whisper services via docker-compose.models.yml.
      NOVA_MODELS_DIR: ${NOVA_MODELS_DIR:-}
      # Nova's own workload runtime (docs/plans/capability-acquisition.md
      # shape 4). A URL and a token, deliberately — not a docker-network
      # coupling — because the same interface reaches a real k3s on another
      # machine, which is where this is going. Set up with workloads/setup.sh;
      # the PRESENCE of the token file is what enables the tools, so a stack
      # with no cluster simply reports the runtime as unconfigured.
      NOVA_K8S_API_URL: ${NOVA_K8S_API_URL:-https://host.docker.internal:6550}
      NOVA_K8S_NAMESPACE: ${NOVA_K8S_NAMESPACE:-nova-workloads}
      SEARXNG_URL: http://searxng:8080
      INFERENCE_CONTROL_URL: http://inference-control:9911
      MCP_RUNNER_URL: http://mcp-runner:8100
      # Shared with the mcp-runner service below. That sidecar execs
      # operator-registered launchers; without this both ends fail closed
      # (it 503s, nothing runs) rather than trusting the compose network.
      NOVA_MCP_RUNNER_TOKEN: ${NOVA_MCP_RUNNER_TOKEN:-}
      # Shared secret for the ACP coding sidecar (`coder` profile). Unset means
      # the broker refuses everything AND coder.configured() reads delegation
      # as unavailable — the credential is the feature switch, so a stack
      # without the sidecar behaves exactly as before.
      NOVA_CODER_TOKEN: ${NOVA_CODER_TOKEN:-}
      MEDIA_WORKER_URL: http://media:8500
      NTFY_BUILTIN_URL: http://ntfy:80
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # NOVA_MEMORY_DIR: point memory anywhere plain files can live — a NAS
      # mount, an Obsidian vault folder, another disk. Markdown in, markdown
      # out; the index rescans on startup and reindexes on write.
      - ${NOVA_MEMORY_DIR:-./data/memory}:/app/data/memory
      - ./data/wake-training:/app/data/wake-training
      # Home Assistant's config dir (roadmap #35), so the deploy can make it
      # TRUST THE TAILNET PROXY. Without an `http:` block naming the compose
      # subnet, HA answers 400 to every request carrying X-Forwarded-For —
      # measured 2026-08-05 — which means it works on the host and is dead
      # from the phone. Reaching it from another device is the entire point
      # of running it here, so that config is part of the deploy rather than
      # something the operator discovers later.
      - ./data/home-assistant:/app/data/home-assistant
      # documents the operator handed over (roadmap #22b). Its OWN mount, not
      # a corner of the memory tree: that tree is relocatable to an Obsidian
      # vault and is hand-editable markdown, and binaries do not belong in it.
      # If this mount is missing the backend REFUSES uploads rather than
      # writing the only copy of a photographed letter into a container layer.
      - ./data/attachments:/app/data/attachments
      # scratch space she can write into and the operator can browse in
      # Library → Files. Its own mount for the same reason attachments has
      # one: nothing in it is a memory note, and OkfStore.iter_files would
      # never see it if it were nested there.
      - ./data/workspace:/app/data/workspace
      # the ServiceAccount credential for her runtime, written by
      # workloads/setup.sh. Read-only and gitignored: it is a bearer token
      # scoped to one namespace, and nothing in the backend should rewrite it.
      # backup bundles (roadmap #31). A BIND, not a volume: a backup that
      # only exists inside the thing it is backing up is not a backup, and
      # the operator has to be able to copy one off this machine.
      - ./data/backups:/app/data/backups
      # read-only view of the project for the backup coverage scan — it
      # derives what to archive from the compose file and git, both of which
      # live on the host side.
      - .:/app/project:ro
      - ./data/runtime:/app/data/runtime:ro
      - ./backend:/app/backend:cached
      # tiny shared control channel to the inference-control sidecar: the
      # backend writes the operator-chosen model-store path here, the sidecar
      # reads it when (re)creating ollama. Not a data path — one text file.
      # read-only, for the backup snapshot only. The tailnet node identity
      # and private key: TS_AUTHKEY is consumed once, so losing this means
      # re-authenticating the node by hand. Without the mount the snapshot
      # REFUSES rather than shipping a bundle that quietly lacks it.
      - tailscale_state:/vol/tailscale_state:ro
      - nova_state:/state
    develop:
      watch:
        - path: ./backend/app
          action: sync
          target: /app/backend/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Bundled local inference (optional): docker compose --profile inference up -d
  # CPU works for small models; for NVIDIA GPU add a deploy.resources.reservations
  # block (documented in README). Host-run Ollama: set the URL in Settings → Inference.
  ollama:
    image: ollama/ollama:latest
    profiles: ["inference"]
    ports:
      - "127.0.0.1:11434:11434"
    # DELIBERATELY NO OLLAMA_CONTEXT_LENGTH. It used to pin 16384 so that
    # Nova's matching setting could mirror it; both are gone (2026-07-31).
    # The backend now sends options.num_ctx per call, computed per model by
    # `local_context` from the attention shape the model publishes and the
    # VRAM actually free — one number, measured, and it fits a 3B and a
    # 262,144-token model correctly where a single pin could not.
    #
    # Leaving it UNSET is not merely tidier. Upstream, `usesAutomaticNumCtx`
    # is `envconfig.ContextLength() == 0`, so setting it at all made every
    # request non-automatic and silently disabled two of ollama's own
    # protections: its VRAM-tier default, and `reduceAutoNumCtxForLoadOOM`,
    # the backoff that retries a failed load at 32768 then 4096. Those are
    # the safety net under any call that arrives without a num_ctx.
    environment:
      # ONE MODEL RESIDENT AT A TIME. Ollama's default keeps each loaded for
      # minutes after its last call, which is right for a chat box and wrong
      # for anything that walks a fleet: the nightly tournament runs six
      # models back to back at about that interval, and on 2026-08-04 three
      # sat on the card at once — 19.7 GB of 24 — while two were already
      # finished. `local_context` sizes a window against what is free, so the
      # windows collapsed to 8,192 and the router refused prompts the models
      # could easily have held.
      #
      # This is the blunt half; `model_tournament._evict()` is the precise
      # half, because the SIZING happens before the next load and so cannot
      # wait for ollama's own eviction. 1 rather than 2 because main runs a
      # cloud model now — the only local consumers left are the standby and
      # the nightly ranking, and neither wants a neighbour.
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  # Docker control sidecar: the ONLY container holding the docker socket
  # (root-equivalent on the host — the backend never mounts it). Exposes a
  # fixed-verb API (status/start/stop of the bundled ollama service, nothing
  # parameterized) on the compose network only — no published ports.
  inference-control:
    build: ./inference-control
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/compose/docker-compose.yml:ro
      - ./docker-compose.gpu.yml:/compose/docker-compose.gpu.yml:ro
      - ./docker-compose.models.yml:/compose/docker-compose.models.yml:ro
      # The repo, READ-ONLY, so the sandbox boot gate can reach the candidate
      # branch's compose file under .worktrees/. Read-only is the whole point:
      # this container holds the docker socket, and repository WRITES live in
      # git-landing instead. Neither holds both.
      - .:/repo:ro
      # operator-chosen model-store path, written by the backend (read-only
      # here — the sidecar only ever reads where to bind, never sets it)
      - nova_state:/state:ro
    environment:
      # auto: use the GPU override when the docker NVIDIA runtime exists;
      # on/off force it (e.g. OLLAMA_GPU=on for Docker Desktop setups that
      # support --gpus without advertising an nvidia runtime)
      OLLAMA_GPU: ${OLLAMA_GPU:-auto}
      # absolute host path to relocate the bundled model store; when set, the
      # sidecar merges docker-compose.models.yml so the ollama toggle recreates
      # the container binding $NOVA_MODELS_DIR/ollama. Empty = default volume.
      NOVA_MODELS_DIR: ${NOVA_MODELS_DIR:-}
      # The repo's absolute path ON THE HOST. Compose resolves relative bind
      # mounts against the compose FILE's directory, which inside this
      # container is /compose — so a service this sidecar starts with a
      # `./data/...` bind would mount a path in the sidecar's own filesystem
      # and lose it on the next rebuild. Measured 2026-08-05 when Home
      # Assistant became the first sidecar-started service with a relative
      # bind. Passed through so `--project-directory` can correct it.
      NOVA_HOST_ROOT: ${PWD:-}
    restart: unless-stopped
    # The sandbox boot gate (docs/plans/sandbox-instance.md) runs a SECOND
    # compose project, `-p nova-sandbox`, from a worktree under .worktrees/.
    # That needs the compose file of the CANDIDATE branch, which lives in the
    # repo rather than in the three files mounted above — read-only, because
    # this container only ever reads what to run. Creating the worktree is
    # git-landing's job: repository writes and the docker socket stay in
    # different containers.
    labels:
      nova.sandbox: "runs -p nova-sandbox from .worktrees/, repo mounted ro"

  # Repository write access, in one container that can do nothing else
  # (roadmap: phase 4 of the autonomy lane). Nova writes code through
  # `delegate_coding_task`, which produces a branch and a diff inside the
  # coder's private volume — a safe place, and a place nothing could reach, so
  # every change she wrote still had to be typed out by a human against the
  # real repo. This is what lands it instead.
  #
  # WHY IT IS NOT THE BACKEND. The backend is the process a poisoned web page
  # talks to, and it deliberately mounts the repo READ-ONLY (/app/project).
  # Giving it write access would put "rewrite your own source" one prompt
  # injection away. Same argument as inference-control and the docker socket:
  # the dangerous capability gets its own container and a fixed verb list.
  #
  # WHAT IT CANNOT DO, enforced in server.py rather than promised here: land
  # on `main` (branch names must match `nova/<slug>`), push (there is no
  # remote credential in this image), apply onto a dirty worktree, or leave a
  # half-applied patch (a conflicting `git am` aborts and deletes the branch).
  # No published port — only the backend talks to it, over the compose network.
  git-landing:
    build: ./git-landing
    profiles: ["coder"]
    # RUNS AS THE OPERATOR, not root. It writes into HIS `.git` — branches,
    # objects, worktree metadata — and as root those files come out
    # root-owned, so his own `git commit` then fails with "insufficient
    # permission for adding an object to repository database". Measured
    # 2026-08-05: landing two branches locked him out of his own repository
    # until the ownership was put back.
    #
    # A container that edits the operator's files has to be the operator, or
    # it is quietly taking them away from him.
    user: "${NOVA_UID:-1000}:${NOVA_GID:-1000}"
    environment:
      NOVA_REPO_DIR: /repo
      # The commit author for landed work. Attribution matters on a machine
      # where two authors write to one repo: `git log --author` has to be able
      # to answer "what did she write".
      GIT_AUTHOR_NAME: ${NOVA_GIT_AUTHOR_NAME:-Nova}
      GIT_AUTHOR_EMAIL: ${NOVA_GIT_AUTHOR_EMAIL:-nova@localhost}
      GIT_COMMITTER_NAME: ${NOVA_GIT_AUTHOR_NAME:-Nova}
      GIT_COMMITTER_EMAIL: ${NOVA_GIT_AUTHOR_EMAIL:-nova@localhost}
    volumes:
      # The ONLY read-write mount of the repo anywhere in this stack.
      - .:/repo
    # :9412 is the landing API; :9418 is `git daemon` serving the SAME repo
    # READ-ONLY so the coding agent clones the operator's real HEAD instead of
    # GitHub. Neither is published to the host — compose network only.
    #
    # Measured 2026-08-05: with the workspace pointed at GitHub, his local main
    # was three commits ahead and unpushed, so the agent cloned a tree without
    # the file it was asked to edit, changed nothing, and reported `done`. A
    # silent no-op is the worst failure shape there is.
    expose: ["9912", "9418"]
    restart: unless-stopped

  # stdio MCP server bridge (docs/plans/mcp-client.md, phase 4). Spawns
  # operator-registered stdio MCP servers as subprocesses on the backend's
  # behalf — no Docker socket, no DB credentials, no published ports.
  # Every command it runs comes from an mcp_servers row whose command passed
  # the backend's launcher allow-list, never from an agent or the network.
  mcp-runner:
    build: ./mcp-runner
    restart: unless-stopped
    # This container EXECUTES operator-registered stdio MCP servers — npx and
    # uvx fetch and run third-party packages. It was root, with a writable
    # root filesystem, full default capabilities and no host mounts only by
    # omission. The launcher allow-list stops arbitrary COMMANDS; nothing
    # stopped an allowed launcher from running a hostile package.
    #
    # No host mounts here, ever, and none by default: a workspace directory
    # for a filesystem server gets mounted read-only and named explicitly
    # (containment plan phase 3), never the parent of the repo, which holds
    # .env.
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # npx/uvx need somewhere to unpack; tmpfs is wiped on restart and
      # cannot persist a compromised package across a recreate
      - /tmp:size=512m
      - /home/mcp/.npm:size=256m
      - /home/mcp/.cache:size=256m
    environment:
      HOME: /home/mcp
      NPM_CONFIG_CACHE: /home/mcp/.npm
      # Must match the backend's. Unset = every exec request refused.
      NOVA_MCP_RUNNER_TOKEN: ${NOVA_MCP_RUNNER_TOKEN:-}
    volumes:
      # The read-only view of the repo Nova may READ (containment plan
      # phase 3). Named file by file and directory by directory, so what is
      # excluded is excluded STRUCTURALLY rather than by a filter that could
      # drift:
      #   .env            never mounted — it holds NOVA_AUTH_TOKEN and the
      #                   provider keys, and a granted read tool would hand
      #                   them to whichever cloud model is answering
      #   frontend/       only src/ — node_modules is thousands of
      #                   third-party packages whose READMEs are
      #                   attacker-controlled text, i.e. an injection
      #                   surface handed straight to a read tool
      #   tools/          omitted entirely — it carries a .venv and the
      #                   wake-training data/
      #   data/           omitted — memory and wake clips, which Nova
      #                   already reaches through her own tools
      #   .git/           omitted — history is the git server's job, and it
      #                   can only surface TRACKED content (.env is not)
      - ./backend/app:/workspace/backend/app:ro
      - ./backend/tests:/workspace/backend/tests:ro
      - ./frontend/src:/workspace/frontend/src:ro
      - ./docs:/workspace/docs:ro
      - ./ROADMAP.md:/workspace/ROADMAP.md:ro
      - ./CLAUDE.md:/workspace/CLAUDE.md:ro
      - ./README.md:/workspace/README.md:ro
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro

  # ACP coding sidecar (optional): docker compose --profile coder up -d
  # docs/plans/acp-coding-delegation.md phase 1. Nova drives an existing
  # coding agent (@agentclientprotocol/claude-agent-acp) rather than carrying
  # a harness of her own; this container is where that agent runs.
  #
  # IT IS THE BOUNDARY, and deliberately so. Phase 0 measured that ACP cannot
  # confine an agent — asking permission is MAY not MUST, declining the client
  # filesystem capability changes nothing (the agent uses its own in-process
  # tools), `cwd` is not enforced, and ACP v2 deletes the mediation surface
  # altogether. So none of the confinement lives in the protocol:
  #
  #   NO host mounts        the repo is never bind-mounted. Work happens in a
  #                         PRIVATE CLONE inside a named volume, because a git
  #                         worktree is not a portable containment unit (its
  #                         .git is a pointer into the parent repo).
  #   NO docker socket      unlike inference-control.
  #   NO database, NO NOVA_AUTH_TOKEN — the broker strips them from the
  #                         agent's environment too (coder/acp.py::_env).
  #   ONE credential        the coding agent's own model key, and nothing else.
  coder:
    build: ./coder
    profiles: ["coder"]
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m
      - /home/coder:size=256m
    environment:
      HOME: /home/coder
      # Must match the backend's. Unset = every request refused, because a
      # token that defaults to off is not a control (mcp-runner, 2026-07-31).
      NOVA_CODER_TOKEN: ${NOVA_CODER_TOKEN:-}
      # The agent's model credential. Points the Claude Agent SDK at any
      # Anthropic-Messages-shaped endpoint — OpenRouter's was measured working
      # in phase 0, which reaches Gemini/GPT/Kimi/Llama on the key Nova
      # already has. NB no /v1: the SDK appends /v1/messages.
      ANTHROPIC_BASE_URL: ${CODER_BASE_URL:-https://openrouter.ai/api}
      # Prefer a SEPARATE, spend-capped key from the one Nova's own turns use,
      # so a runaway coding session cannot exhaust her inference budget.
      ANTHROPIC_AUTH_TOKEN: ${CODER_API_KEY:-}
      # PIN THE MODEL. Unset, the Agent SDK picks its own default and asks for
      # a 64k output budget — and OpenRouter refuses a request whose max_tokens
      # exceeds what the remaining credit affords, so an unpinned coder starts
      # failing with a 402 as the balance drops while cheaper calls still
      # succeed. Measured 2026-07-31: "requested up to 64000 tokens, but can
      # only afford 63871" with $22 left on the key. Pinning makes the cost per
      # session predictable and the failure mode legible.
      ANTHROPIC_MODEL: ${CODER_MODEL:-anthropic/claude-sonnet-4.6}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${CODER_MODEL:-anthropic/claude-sonnet-4.6}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${CODER_MODEL:-anthropic/claude-sonnet-4.6}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${CODER_SMALL_MODEL:-anthropic/claude-haiku-4.5}
      CODER_SESSION_BUDGET_S: ${CODER_SESSION_BUDGET_S:-1800}
    volumes:
      # Private clone space. A named volume, not a bind: nothing on the host
      # is reachable, and `docker volume rm` is the whole cleanup story.
      - nova_coder_workspaces:/workspaces

  # Media ingestion worker (optional): docker compose --profile media up -d
  # yt-dlp (1000+ sites — YouTube, Vimeo, Twitch, direct .mp4/.mp3 links,
  # ...; keyless) + ffmpeg. Pulls site captions when offered; falls back to
  # the whisper service (voice profile) for audio->text on caption-less
  # videos and direct media URLs — the universal fallback that makes
  # ingestion source-agnostic. No published port: only the backend talks to
  # it, over the compose network (docs/plans/content-ingestion.md).
  media:
    build: ./media
    profiles: ["media"]
    environment:
      WHISPER_URL: http://whisper:9000
      MEDIA_MAX_DURATION_S: ${MEDIA_MAX_DURATION_S:-14400}
      MEDIA_WHISPER_WINDOW_S: ${MEDIA_WHISPER_WINDOW_S:-300}
    restart: unless-stopped

  # Home Assistant (optional): docker compose --profile home up -d
  #
  # ROADMAP #35, LOCKED by Jeremy 2026-07-24: HA Container as a nova compose
  # service now; a dedicated HAOS box later for Zigbee/Thread. IP-based
  # devices only under WSL2 — no USB-radio passthrough fights.
  #
  # THIS BLOCK IS THE CONTAINMENT. Nova does not author it and cannot edit
  # it: she reaches Home Assistant through one fixed verb on the docker
  # sidecar (`/home/start`), never by submitting YAML. That was Jeremy's
  # choice on 2026-08-05 when the alternative — letting her write compose
  # files that land on the host — was put in front of him. The consequence
  # is that adding the NEXT service means editing this file and reviewing
  # the diff, which is the review point, not a limitation to route around.
  #
  # NO host networking, deliberately. mDNS/SSDP discovery needs it, and
  # under WSL2 host networking does not behave the way it does on Linux
  # anyway. Bridge + a published port reaches IP-addressable devices
  # outbound, which is exactly the scope #35 locked. If discovery becomes
  # necessary it is a HAOS box, not a flag on this block.
  #
  # 127.0.0.1 like every other published port here: reachable from the
  # phone over tailscale, never from the LAN directly.
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    profiles: ["home"]
    environment:
      TZ: ${NOVA_TZ:-America/New_York}
    volumes:
      - ./data/home-assistant:/config
    ports:
      - "127.0.0.1:8123:8123"
    restart: unless-stopped
    healthcheck:
      # HA answers / with a 200 once the frontend is built; the first boot
      # takes a while, so start_period is generous rather than the interval.
      test: ["CMD-SHELL", "curl -sf http://localhost:8123/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Self-hosted ntfy server (optional): docker compose --profile notify up -d
  # The private alternative to public ntfy.sh for push notifications — set
  # Settings -> Notifications -> ntfy server to "builtin" and the backend
  # publishes here over the compose network. Nothing leaves your machine
  # except the final push to your subscribed phone. To reach it FROM the
  # phone, expose it on your tailnet (README) — the app points at that URL,
  # the backend at http://ntfy:80; same server, same topic, two paths.
  # The published localhost port is only so you can front it with a reverse
  # proxy / tailscale serve. Roadmap #21.
  ntfy:
    image: binwiederhier/ntfy
    command: serve
    profiles: ["notify"]
    environment:
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8280}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: ${NTFY_CACHE_DURATION:-12h}
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      NTFY_BEHIND_PROXY: "true"
      # iOS can't hold a background socket, so the ntfy iOS app relies on Apple
      # push (APNs), which only ntfy.sh can trigger. Setting an upstream lets
      # THIS server forward a content-free wake-up ping through ntfy.sh so iOS
      # gets instant delivery — the message body stays on your server. Android
      # needs none of this. Set NTFY_UPSTREAM_BASE_URL="" in .env for zero
      # third-party contact (iOS then falls back to slower polling).
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL-https://ntfy.sh}
    volumes:
      - ntfy_cache:/var/cache/ntfy
    ports:
      - "127.0.0.1:8280:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:80/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  # Optional batteries-included reachability: joins YOUR tailnet as node
  # "nova" and serves the web origin at https://nova.<tailnet>.ts.net with
  # a real certificate — identical on WSL2/Linux/macOS, no host Tailscale
  # install. Opt in: put TS_AUTHKEY in .env, then
  #   docker compose --profile tailscale up -d
  # Userspace networking: no NET_ADMIN, no /dev/net/tun — inbound proxy only.
  # Node identity persists in the volume; the auth key is consumed once.
  tailscale:
    image: tailscale/tailscale:latest
    profiles: ["tailscale"]
    hostname: nova
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale_state:/var/lib/tailscale
      # THE DIRECTORY, not the single file — the same repair searxng needed
      # after a 43-hour outage. A single-file bind resolves to an inode at
      # container-create time, so EDITING serve.json breaks the mount and the
      # container will not start: "no such file or directory" on a path that
      # plainly exists. It happened here on 2026-08-05 while adding the Home
      # Assistant route, and it takes the phone path down with it, because
      # :443 is served by this same container.
      #
      # Port 8123 in that file is a TLS-TERMINATED TCP FORWARD, not an HTTP
      # proxy like :443 and :8443. Proxying Home Assistant as HTTP makes
      # tailscale add X-Forwarded-For, and HA answers 400 to any forwarded
      # request unless its own configuration.yaml trusts the proxy — measured
      # 2026-08-05, and it kept answering 400 even once that config was
      # verifiably parsed. Forwarding raw TCP means HA never sees a forwarded
      # header, so reachability stops depending on a setting inside an
      # application Nova does not own. (JSON has no comments and that map is
      # keyed by port number, so this note cannot live in serve.json — a
      # non-numeric key there makes tailscale discard the whole config.)
      - ./tailscale:/config:ro
    depends_on:
      - web
    restart: unless-stopped

  # Nova's voice (optional): docker compose --profile voice up -d
  # Local Kokoro TTS (kokoro-onnx, CPU — faster than realtime on a modern
  # CPU; no GPU wiring needed). Model files (~340 MB) download to the
  # volume on first start; watch `docker compose logs -f kokoro`.
  kokoro:
    build: ./kokoro
    profiles: ["voice"]
    ports:
      - "127.0.0.1:8880:8880"
    volumes:
      - kokoro_models:/models
    restart: unless-stopped

  # Nova's ears (optional, same `voice` profile): faster-whisper STT for
  # push-to-talk. CPU + int8 by default (sub-second for short utterances);
  # model files download to the volume on first start. Set WHISPER_MODEL to
  # trade speed for accuracy (tiny|base|small|medium).
  whisper:
    build: ./whisper
    profiles: ["voice"]
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-small}
      # CPU-safe defaults; docker-compose.gpu.yml overrides to cuda/float16 and
      # a bigger model. WHISPER_IDLE_UNLOAD_S frees the model from (V)RAM after
      # this many idle seconds (reloads on demand) so the GPU is reclaimable.
      WHISPER_DEVICE: ${WHISPER_DEVICE:-cpu}
      WHISPER_COMPUTE: ${WHISPER_COMPUTE:-int8}
      WHISPER_IDLE_UNLOAD_S: ${WHISPER_IDLE_UNLOAD_S:-300}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - whisper_models:/models
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-nova-searxng-dev-secret}
      SEARXNG_BASE_URL: http://searxng:8080/
    ports:
      - "127.0.0.1:8380:8080"
    volumes:
      # The DIRECTORY, not the single file. A single-file bind resolves to an
      # inode at container-create time, so when Docker Desktop recycled its
      # WSL mount the container died with exit 127 and `restart:
      # unless-stopped` retried it forever without ever being able to repair
      # it. Web search was down for 43 hours (2026-08-01 19:52 → 08-03) and
      # the operator found out by asking a question that failed.
      - ./searxng:/etc/searxng:ro
    restart: unless-stopped
    # It had no healthcheck while postgres, media, ntfy, kokoro and whisper
    # all had one — so `docker compose ps` reported it Up right up until it
    # wasn't, and nothing downstream could tell the difference.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend/src:/app/src:cached
      - ./frontend/public:/app/public:cached

  # The phone-facing entry: built PWA + API behind one origin. Bound to
  # localhost only — expose it via `tailscale serve` (recommended) or a
  # tunnel, and set NOVA_AUTH_TOKEN first.
  web:
    build:
      context: ./frontend
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    # /health traverses nginx AND its proxy to the backend, so red here means
    # the phone path is genuinely broken rather than just slow.
    # 127.0.0.1, not localhost: the container's /etc/hosts maps localhost to
    # ::1 as well, wget tries that first, and nginx listens on IPv4 only — so
    # the check failed on every probe since it was added and `docker compose
    # ps` showed web (unhealthy) while it was happily serving 200s. A column
    # that is always red is worse than no column, because the next real
    # outage looks identical to it.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_models:
  tailscale_state:
  kokoro_models:
  whisper_models:
  nova_state:
  ntfy_cache:
  # private clones for the coder sidecar — never a host bind
  nova_coder_workspaces:
