# The identity Nova acts as, defined by what it CANNOT do.
#
# She deploys and manages freely inside this namespace (Jeremy, 2026-07-29:
# no approval, reads and writes both, inside a goal). So the interesting part
# of this file is the absences, and each one is load-bearing rather than
# cautious.
#
# NOT GRANTED, and why each would dissolve the boundary:
#
#   namespaces (any verb)   — Pod Security enforcement is a LABEL on the
#                             namespace. Patch the namespace, drop the label,
#                             and `restricted` is gone. This is the single
#                             most important omission in the file.
#   networkpolicies         — same shape: she could delete default-deny.
#   resourcequotas,         — she could raise her own ceiling.
#   limitranges
#   roles, rolebindings,    — an identity that can grant is not bounded by
#   serviceaccounts           what it was granted. The #18 rule ("nothing an
#                             agent can write may be the switch") applied to
#                             a runtime.
#   anything cluster-scoped — this is a Role, not a ClusterRole. Nodes,
#                             CRDs, other namespaces, cluster secrets: all
#                             unreachable by construction rather than by a
#                             list of denials.
#   pods/exec, pods/attach  — shell into a running pod is arbitrary code with
#                             that pod's identity, and it bypasses the spec
#                             review that Pod Security performs at admission.
#                             `pods/log` IS granted: reading output is how she
#                             debugs a deployment, and it grants nothing.
#
# GRANTED: the objects a service is made of. Deployments, Services, PVCs,
# ConfigMaps, Secrets — Secrets included, because a service she deploys needs
# its own credentials and there is no way to run Home Assistant without one.
# Those secrets are namespace-scoped and she cannot read any other namespace's.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nova-deployer
  namespace: nova-workloads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role                      # Role, never ClusterRole
metadata:
  name: nova-deployer
  namespace: nova-workloads
rules:
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, services, configmaps, secrets, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods/log]       # debugging, yes. pods/exec, no.
    verbs: [get, list]
  - apiGroups: [""]
    resources: [events]         # "why is my pod not starting" lives here
    verbs: [get, list, watch]
  # READ the policies that constrain her, and only read.
  #
  # Added after the phase-4 acceptance test: her dashboard could not reach
  # pypi.org, she diagnosed it correctly from pod logs, and then had to hedge —
  # "egress is blocked or not allowed" — because she cannot see the
  # NetworkPolicy that is doing it. A boundary an agent cannot see is one she
  # invents explanations for, which is the failure mode this whole codebase
  # keeps closing. State what is true.
  #
  # Reading is safe: a NetworkPolicy is not a secret, and the verbs that could
  # weaken one (patch, update, delete) are still absent — as are namespaces,
  # resourcequotas and limitranges, for the same reason.
  # CREATE, and read. Never patch, update or delete.
  #
  # NetworkPolicies are ADDITIVE — one can only ever allow more, never less —
  # so `create` cannot weaken default-deny, and without patch/update/delete
  # default-deny cannot be modified or removed by anything reachable from the
  # model. That asymmetry is what makes opening egress safe to grant at all.
  #
  # The consequence, stated because it is a real one: an egress grant PERSISTS.
  # Nothing here can revoke it, including the backend. Closing a hole is
  # `kubectl delete networkpolicy <name> -n nova-workloads`, deliberately the
  # operator's. A firewall hole that silently re-closed when a goal expired
  # would be its own kind of surprise.
  #
  # And she still cannot submit a policy DOCUMENT: deploy_workload's KINDS map
  # has no NetworkPolicy, so the only way to reach this verb is the two egress
  # tools, which compose a fixed template from a validated address.
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, create]
  - apiGroups: [""]
    resources: [resourcequotas, limitranges]
    verbs: [get, list]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nova-deployer
  namespace: nova-workloads
subjects:
  - kind: ServiceAccount
    name: nova-deployer
    namespace: nova-workloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nova-deployer
