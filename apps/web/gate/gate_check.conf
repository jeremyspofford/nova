# Shared by every gated location (apps/web/nginx.conf.template) via
# `include`. $gate_block is computed once per request from the maps at the
# top of the rendered conf: enabled AND no matching cookie. Deliberately not
# a .conf file directly under conf.d/ — nginx.conf's `include
# /etc/nginx/conf.d/*.conf;` would otherwise try to load this fragment as a
# second top-level server file, and a bare `if {}` outside any location
# block is a syntax error.
if ($gate_block) {
    return 401;
}
