<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- The first frame's icon, before React. The theme store replaces this
         href with the mark painted from the live palette (src/lib/app-icon.ts)
         a beat later, or with whichever icon this browser has chosen; this
         only has to be a Nova mark rather than the browser's blank page
         glyph. The v3 swirl serves that, and is also one of the choices.
         Files live in apps/web/public/, which vite copies to the build root,
         so :5173 and the baked nginx image answer the same paths. -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Add to Home Screen. The manifest gives Android/Chromium the name,
         the standalone display mode, the ground colour and a maskable icon;
         iOS reads almost none of it and needs the two apple- metas below for
         the same effect.

         NOTE, because it will look like a bug otherwise: the home-screen
         icon CANNOT follow the theme. A manifest takes static PNGs, while
         the in-app mark is an SVG painted from the live palette
         (src/lib/app-icon.ts). So the phone shows the v3 swirl whatever
         icon is chosen in Appearance — which is also the better choice for
         a home screen, where a distinctive shape beats a letterform. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- NOT black-translucent. That draws the web view UNDER the status bar,
         and nothing in this app pads for `env(safe-area-inset-top)` — only
         the two bottom insets are handled (MobileNav, the chat input). It
         was set to black-translucent on 2026-09-15 and the owner's phone
         immediately showed the "Chat" heading behind the clock. v3 hit the
         same wall from the other side (memory: iOS reports a top inset of 0
         while full-bleed), so the safe answer is to let iOS reserve the bar
         until the shell genuinely handles a top inset. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Nova" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#0c0a09" />
    <!-- The first frame, before React: read the saved mode and paint the
         ground in it. Without this every load of a dark theme flashed white
         until the theme store mounted. The store repaints with the real
         palette a beat later; this only has to be the right SIDE of dark. -->
    <script>
      (function () {
        var dark = true;
        try {
          var s = JSON.parse(localStorage.getItem('nova-appearance') || '{}');
          var p = s.modePreference;
          dark = p === 'light' ? false
            : p === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : true;
        } catch (e) {}
        var h = document.documentElement;
        h.classList.toggle('dark', dark);
        h.style.colorScheme = dark ? 'dark' : 'light';
        h.style.backgroundColor = dark ? '#0c0a09' : '#fafaf9';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0c0a09' : '#fafaf9');
      })();
    </script>
    <title>Nova</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
