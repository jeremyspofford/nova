<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- The first frame's icons, before React. The theme store replaces both
         hrefs a beat later with the icon this browser has chosen, in the
         palette on screen (src/lib/app-icon.ts): the tab gets an SVG painted
         live, the touch link gets the matching file under /icons/touch/.
         These only have to be Nova marks rather than the browser's blank
         page glyph. icon-192.png is the amber orb (also the manifest's);
         the v3 swirl kept its own file (cosmic-192.png) and is one of the
         choices in Appearance. Files live in apps/web/public/, which vite
         copies to the build root, so :5173 and the baked nginx image answer
         the same paths. -->
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/touch/mark-teal-stone-dark.png" />
    <!-- Add to Home Screen. The manifest gives Android/Chromium the name,
         the standalone display mode, the ground colour and a maskable icon
         (the amber orb — a manifest is static, so Android does not follow
         the Appearance choice); iOS reads almost none of it and needs the
         apple-touch-icon above plus the two apple- metas below.

         NOTE, because it will look like a bug otherwise: an INSTALLED iOS
         app never changes its icon. iOS copies the apple-touch-icon once,
         when the app is added, and never fetches it again. What the
         Appearance choice controls is which file the phone is handed on
         the NEXT add (a real PNG per reachable choice and palette, made by
         scripts/make-icons.mjs); to change an installed icon, remove Nova
         from the home screen and add it again. The Appearance hint says
         the same. (2026-09-17, after the owner asked why it never moved.) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- black-translucent: the web view fills the whole screen. With
         `default`, iOS sized the view as (screen minus status bar) but still
         drew it from the top edge, leaving a status-bar-height dead band
         under the tab bar — the owner's screenshot on 2026-09-15 measured
         it at ~64pt. Full-bleed is only safe because the top inset is now
         padded from a MEASURED value (src/lib/safeArea.ts), not from env(),
         which an installed iOS app can report as 0. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Nova" />
    <!-- No font <link> here on purpose. Every face this app can use is
         self-hosted through @fontsource-variable and bundled (index.css for
         the default, src/lib/fonts.ts on demand for the rest): a Google
         Fonts request would tell them the IP of every household running a
         private assistant, and this one has to work with no internet at
         all. -->
    <meta name="theme-color" content="#0c0a09" />
    <!-- The first frame, before React: read the saved mode and paint the
         ground in it. Without this every load of a dark theme flashed white
         until the theme store mounted. The store repaints with the real
         palette a beat later; this only has to be the right SIDE of dark. -->
    <script>
      (function () {
        var dark = true;
        try {
          var s = JSON.parse(localStorage.getItem('nova-appearance') || '{}');
          var p = s.modePreference;
          dark = p === 'light' ? false
            : p === 'system' ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : true;
        } catch (e) {}
        var h = document.documentElement;
        h.classList.toggle('dark', dark);
        h.style.colorScheme = dark ? 'dark' : 'light';
        h.style.backgroundColor = dark ? '#0c0a09' : '#fafaf9';
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', dark ? '#0c0a09' : '#fafaf9');
      })();
    </script>
    <title>Nova</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
