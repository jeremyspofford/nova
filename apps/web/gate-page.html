<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Access</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #111318;
    color: #e8e8ec;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  form { display: flex; gap: 8px; }
  input {
    padding: 10px 12px;
    border: 1px solid #3a3d46;
    border-radius: 6px;
    background: #1a1c22;
    color: #e8e8ec;
    font-size: 16px;
    min-width: 220px;
  }
  button {
    padding: 10px 16px;
    border: 0;
    border-radius: 6px;
    background: #4c7cf0;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover { background: #3d6ae0; }
</style>
</head>
<body>
<form action="/gate" method="get" autocomplete="off">
  <input type="password" name="token" placeholder="Access token" autofocus required>
  <button type="submit">Enter</button>
</form>
</body>
</html>
