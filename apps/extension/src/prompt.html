<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nova asks to search your history</title>
    <link rel="stylesheet" href="pages.css" />
  </head>
  <body>
    <h1>Search your history?</h1>
    <p>Nova asks to search your browsing history once for:</p>
    <p id="query" class="query"></p>
    <p>Only the matching pages' titles and sites go to Nova. Nothing is kept allowed afterwards.</p>
    <button id="allow" type="button">Allow this search</button>
    <button id="deny" type="button" class="quiet">Don't allow</button>
    <script type="module" src="prompt.js"></script>
  </body>
</html>
