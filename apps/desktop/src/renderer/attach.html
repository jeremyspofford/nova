<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="shell.css" />
    <script src="text.js" defer></script>
    <script src="attach.js" defer></script>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="stack">
        <h1 id="title" data-t="title"></h1>
        <p id="source" class="muted"></p>
        <p class="hint" data-t="nothingSentYet"></p>
      </div>
      <div id="error" class="error" role="alert" hidden></div>

      <section id="image-part" class="panel" aria-labelledby="image-h">
        <div class="part-head">
          <h2 id="image-h" data-t="image"></h2>
          <label
            ><input id="keep-image" type="checkbox" checked /> <span data-t="keepImage"></span
          ></label>
        </div>
        <img id="image" class="preview-image" data-t-alt="imageAlt" alt="" hidden />
        <p id="image-note" class="hint"></p>
      </section>

      <section id="text-part" class="panel" aria-labelledby="text-h">
        <div class="part-head">
          <h2 id="text-h" data-t="text"></h2>
          <label
            ><input id="keep-text" type="checkbox" checked /> <span data-t="keepText"></span
          ></label>
        </div>
        <textarea id="text" rows="10" readonly aria-labelledby="text-h" hidden></textarea>
        <p id="text-note" class="hint"></p>
        <p id="redactions" class="hint"></p>
      </section>

      <div class="stack">
        <label for="note" data-t="note"></label>
        <textarea id="note" rows="2"></textarea>
      </div>
      <fieldset>
        <legend class="sr-only" data-t="sendTo"></legend>
        <label id="current-option"
          ><input type="radio" name="target" value="current" /> <span data-t="currentChat"></span
        ></label>
        <label
          ><input type="radio" name="target" value="new" checked /> <span data-t="newChat"></span
        ></label>
      </fieldset>
      <p class="hint" data-t="dataNote"></p>
      <div class="actions end">
        <button id="discard" type="button" data-t="discard"></button>
        <button id="send" type="button" class="primary" data-t="send"></button>
      </div>
    </main>
  </body>
</html>
