<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="shell.css" />
    <script src="text.js" defer></script>
    <script src="quick.js" defer></script>
  </head>
  <body>
    <main class="quick" data-t-aria-label="title">
      <form id="ask" class="ask" novalidate>
        <label for="text" class="sr-only" data-t="message"></label>
        <textarea id="text" rows="2" data-t-placeholder="placeholder"></textarea>
        <button type="submit" class="primary" data-t="send"></button>
      </form>
      <fieldset>
        <legend class="sr-only" data-t="sendTo"></legend>
        <label id="current-option"
          ><input type="radio" name="target" value="current" /> <span data-t="currentChat"></span
        ></label>
        <label
          ><input type="radio" name="target" value="new" checked /> <span data-t="newChat"></span
        ></label>
      </fieldset>
      <div id="sent" role="status" aria-live="polite" class="hint"></div>
      <div id="error" class="error" role="alert" hidden></div>

      <section aria-labelledby="status-h" class="stack">
        <h2 id="status-h" data-t="status"></h2>
        <ul id="status-list" class="status-list" aria-labelledby="status-h"></ul>
      </section>

      <div class="actions">
        <button id="new-task" type="button" data-t="newTask"></button>
        <button id="attach" type="button" data-t="attach"></button>
        <button id="open" type="button" data-t="open"></button>
      </div>
      <ul id="problems" class="hint"></ul>
    </main>
  </body>
</html>
