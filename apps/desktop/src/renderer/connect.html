<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="stylesheet" href="shell.css" />
    <script src="text.js" defer></script>
    <script src="connect.js" defer></script>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="stack">
        <h1 id="title" data-t="title"></h1>
        <p class="muted" data-t="intro"></p>
      </div>

      <p id="current" class="muted" hidden></p>
      <div id="problem" class="error" role="alert" hidden></div>

      <section id="replace" class="panel" aria-labelledby="replace-h" hidden>
        <h2 id="replace-h" data-t="replaceTitle"></h2>
        <p id="replace-text"></p>
        <div class="actions end">
          <button id="replace-cancel" type="button" data-t="keep"></button>
          <button id="replace-confirm" type="button" class="primary"></button>
        </div>
      </section>

      <form id="link-form" class="panel" aria-labelledby="link-h" novalidate>
        <h2 id="link-h" data-t="addTitle"></h2>
        <p class="hint" data-t="addHint"></p>
        <label for="link" data-t="linkLabel"></label>
        <textarea id="link" rows="3" spellcheck="false" autocomplete="off"></textarea>
        <div class="actions end">
          <button type="submit" class="primary" data-t="connect"></button>
        </div>
      </form>

      <p class="or" data-t="or"></p>

      <form id="manual-form" class="panel" aria-labelledby="manual-h" novalidate>
        <h2 id="manual-h" data-t="manualTitle"></h2>
        <div class="stack">
          <label for="url" data-t="urlLabel"></label>
          <input
            id="url"
            type="text"
            inputmode="url"
            placeholder="https://hub.local:7443"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <div class="stack">
          <label for="pin" data-t="pinLabel"></label>
          <input
            id="pin"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-describedby="pin-hint"
          />
          <p id="pin-hint" class="hint" data-t="pinHint"></p>
        </div>
        <div class="actions end">
          <button type="submit" data-t="connect"></button>
        </div>
      </form>

      <p id="status" role="status" aria-live="polite" class="muted"></p>
    </main>
  </body>
</html>
