<!doctype html>
<html lang="en" data-theme="paper" data-mode="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Nova</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <script>
    // Set the theme before first paint, so it never flashes.
    (function () {
      var r = document.documentElement, t = 'paper', m = 'system';
      try { t = localStorage.getItem('nova.theme') || t; m = localStorage.getItem('nova.mode') || m; } catch (e) {}
      r.dataset.theme = t;
      r.dataset.mode = m === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : m;
    })();
  </script>
  <link rel="stylesheet" href="/themes/paper.css">
  <link rel="stylesheet" href="/themes/aurora.css">
  <link rel="stylesheet" href="/themes/obsidian.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="modulepreload" href="/js/app.js">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Conversations">
      <div class="sidebar-head">
        <a class="wordmark" href="/" data-nav="home">Nova</a>
        <button type="button" class="icon-btn" id="new-chat" aria-label="New conversation" title="New conversation (⌘⇧O)"></button>
      </div>
      <nav class="places" aria-label="Places">
        <a class="toc-item place" href="/" id="main-link">Main conversation <span class="place-dot" id="main-dot" hidden><span class="sr-only">New report</span></span></a>
        <a class="toc-item place" href="/memory" id="memory-link">Memory <span class="place-count" id="memory-count"></span></a>
        <a class="toc-item place" href="/skills" id="skills-link">Skills <span class="place-count" id="skills-count"></span></a>
        <a class="toc-item place" href="/schedules" id="schedules-link">Schedules <span class="place-count" id="schedules-count"></span></a>
        <a class="toc-item place" href="/activity" id="activity-link">Activity <span class="place-count is-waiting" id="activity-waiting"></span><span class="pulse place-pulse" id="activity-pulse" hidden></span></a>
      </nav>
      <nav class="toc" id="toc" aria-label="Conversations by day"></nav>
      <div class="sidebar-foot">
        <span class="foot-links"><a class="quiet-btn" href="/settings" id="settings-link">Settings</a><button type="button" class="quiet-btn" id="appearance" aria-haspopup="dialog">Appearance</button></span>
        <span class="status" id="status" role="status"></span>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <main class="main" id="main">
      <header class="topbar">
        <button type="button" class="icon-btn menu-btn" id="menu" aria-label="Show conversations" aria-controls="sidebar" aria-expanded="false"></button>
        <h1 class="topbar-title" id="title"></h1>
      </header>
      <div class="banner" id="banner" role="status" hidden></div>
      <div class="scroller" id="scroller">
        <div class="thread" id="thread"></div>
        <div class="thread memory" id="memory" tabindex="-1" aria-label="Memory" hidden></div>
        <div class="thread memory skills" id="skills" tabindex="-1" aria-label="Skills" hidden></div>
        <div class="thread memory skills schedules" id="schedules" tabindex="-1" aria-label="Schedules" hidden></div>
        <div class="thread memory activity" id="activity" tabindex="-1" aria-label="Activity" hidden></div>
        <div class="thread memory settings" id="settings-view" tabindex="-1" aria-label="Settings" hidden></div>
      </div>
      <div class="toast" id="toast" role="status" hidden></div>
      <button type="button" class="jump" id="jump" hidden>Jump to latest</button>
      <div class="dock" id="dock">
        <form class="composer" id="composer">
          <label class="sr-only" for="input">Message Nova</label>
          <textarea id="input" rows="1" placeholder="Write to Nova…" autocomplete="off" spellcheck="true"></textarea>
          <button type="submit" class="send" id="send" aria-label="Send" disabled></button>
        </form>
        <p class="hint" id="hint" aria-live="polite"></p>
      </div>
    </main>
  </div>

  <dialog class="sheet" id="settings" aria-labelledby="settings-title">
    <form method="dialog">
      <h2 id="settings-title">Appearance</h2>
      <fieldset>
        <legend>Theme</legend>
        <div class="choices" id="theme-choices"></div>
      </fieldset>
      <fieldset>
        <legend>Light and dark</legend>
        <div class="choices row" id="mode-choices"></div>
      </fieldset>
      <div class="sheet-foot">
        <a class="sheet-note" href="/styleguide">Style reference</a>
        <button class="btn primary" value="done">Done</button>
      </div>
    </form>
  </dialog>
</body>
</html>
