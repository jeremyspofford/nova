<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hello</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font:
          14px system-ui,
          sans-serif;
        margin: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Hello from an extension</h1>
    <p>This panel is a <code>ui://</code> resource served from the extension's own files.</p>
    <button id="greet" type="button">Greet Ada</button>
    <pre id="out"></pre>
    <script>
      // The MCP Apps bridge: JSON-RPC over postMessage to the Nova window (docs/08 §3.1).
      let next = 0;
      const pending = new Map();
      window.addEventListener('message', (e) => {
        const m = e.data;
        if (m && m.jsonrpc === '2.0' && pending.has(m.id)) {
          pending.get(m.id)(m);
          pending.delete(m.id);
        }
      });
      function call(method, params) {
        return new Promise((resolve) => {
          const id = ++next;
          pending.set(id, resolve);
          window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
        });
      }
      document.getElementById('greet').addEventListener('click', async () => {
        const r = await call('tools/call', {
          name: 'ext:com.example.hello/greet',
          arguments: { name: 'Ada' },
        });
        document.getElementById('out').textContent = JSON.stringify(r.result ?? r.error, null, 2);
      });
    </script>
  </body>
</html>
