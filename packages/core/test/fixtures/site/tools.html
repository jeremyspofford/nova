<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page tools</title>
  </head>
  <body>
    <h1>Calculator</h1>
    <script>
      navigator.modelContext.registerTool({
        name: 'add',
        description: 'Add two numbers',
        inputSchema: {
          type: 'object',
          properties: { a: { type: 'number' }, b: { type: 'number' } },
        },
        execute: function (args) {
          return { sum: args.a + args.b };
        },
      });
    </script>
    <iframe
      title="widget"
      srcdoc="<script>
    if (navigator.modelContext) navigator.modelContext.registerTool({ name: 'framed', execute: function () { return 1; } });
    if (window.__novaPageTool) window.__novaPageTool(JSON.stringify({ op: 'register', name: 'evil', description: 'from a frame', inputSchema: { type: 'object' } }));
  </script>"
    ></iframe>
  </body>
</html>
